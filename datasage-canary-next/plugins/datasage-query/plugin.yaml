name: datasage-query
version: "0.15.0-rc9"
manifest_version: 2
api_version: 1
# Python dependency ownership is deliberately single-source: PyMySQL 1.2.0 is
# vendored under vendor/ and content-bound by the release receipt. Hermes 0.20.5
# does not install isolated plugin dependencies, so do not add requirements.txt
# or python_dependencies while the vendored loader remains authoritative.
description: "Hermes-native governed business evidence and analysis tools for DataSage Expert."
author: "datasage"
license: "Proprietary"
tags: [data, analytics, business-intelligence, read-only]
provides_tools:
  - datasage_catalog
  - datasage_entity_resolve
  - datasage_query
requires_env:
  - name: DATA_QUERY_MYSQL_HOST
    description: "MySQL RDS host."
  - name: DATA_QUERY_MYSQL_PORT
    description: "MySQL RDS port."
    required: false
    default: "3306"
  - name: DATA_QUERY_MYSQL_DATABASE
    description: "Default MySQL database."
  - name: DATA_QUERY_MYSQL_USER
    description: "MySQL account. Account origin is unrestricted; live grants must pass the SELECT-only object-scope policy."
  - name: DATA_QUERY_MYSQL_PASSWORD
    description: "MySQL password."
    secret: true
  - name: DATA_QUERY_MYSQL_SSL_CA
    description: "Optional CA certificate path; required in production mode."
    required: false
config_schema:
  production_mode: {type: bool, default: false, description: "Enable production safety requirements."}
  canary_accept_existing_account: {type: bool, default: false, description: "Allow a validated existing read-only account in canary mode."}
  require_tls: {type: bool, default: true, description: "Require verified TLS for database access."}
  mysql_allowed_grant_scopes: {type: list, default: [], description: "Allowed read-only database grant scopes."}
  mysql_allowed_server_uuids: {type: list, default: [], description: "Optional approved MySQL server UUIDs; required in production mode."}
  mysql_approved_path_roots: {type: list, default: [], description: "Absolute operator-approved roots for database security material."}
  approved_profile_roots: {type: list, default: [], description: "Absolute operator-approved roots for active profile paths."}
  mysql_connect_timeout_seconds: {type: int, default: 8, description: "Connection timeout."}
  mysql_health_connect_timeout_seconds: {type: int, default: 5, description: "Health-check connection timeout."}
  mysql_grant_audit_timeout_seconds: {type: int, default: 10, description: "Grant audit timeout."}
  mysql_query_timeout_seconds: {type: int, default: 30, description: "Per-query timeout."}
  call_timeout_seconds: {type: int, default: 60, description: "Batch call deadline."}
  max_concurrent_queries: {type: int, default: 4, description: "Maximum independent concurrent queries."}
  entity_preflight_max_lookups: {type: int, default: 10, description: "Maximum unique entity tokens checked per batch."}
  max_rows: {type: int, default: 100, description: "Maximum rows returned per request."}
  max_cell_chars: {type: int, default: 2000, description: "Maximum public cell text length."}
  max_dimension_display_chars: {type: int, default: 80, description: "Maximum dimension display length."}
  data_entitlements: {type: dict, default: {}, description: "Governed per-principal data entitlements."}
