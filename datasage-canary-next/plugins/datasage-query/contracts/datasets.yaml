  vk_dw.inventory_barcode_detail_dw:
    domains: [inventory]
    kind: current_snapshot
    grain: one_current_inventory_barcode_record
    primary_key: [id]
    updated_at: gmt_modified
    allowed_columns: [id, bar_code, status, goods_num, piece_num, goods_id, goods_no, goods_name, goods_region, goods_sku_id, attr_val, color_label, batch_no, cylinder_no, unit, is_ht, is_ready, ready_type, whse_id, whse_name, whse_type, whse_dept, whse_region, whse_org, is_missing, is_ccbs_whse, is_defective_whse, customer_dept, is_inner_cus, come_whse_time, estimate_receive_time, sale_time, currency_no, ddp_amount_rmb, ddp_amount]
    required_filters:
      - {column: status, op: in, value: [1, 2, 3]}
    joins:
      - {target: vk_dwd.goods_detail_dwd, local: [goods_id], remote: [goods_id], cardinality: many_to_one, stage: after_fact_aggregation}
      - {target: vk_dwd.whse_info_dwd, local: [whse_id], remote: [whse_id], cardinality: many_to_one, stage: after_fact_aggregation}
    warnings:
      - Department means whse_dept, not customer_dept.
      - Unit-price columns are forbidden.
      - The current physical table has no is_print column; do not expose or infer it from this snapshot.
      - M and m are the same metre unit after lowercase normalization; y, kg, Pcs, and m must never be summed together.
      - Original-currency DDP amount must be filtered or grouped by currency_no.

  vk_dwd.inventory_cost_dwd:
    domains: [inventory]
    kind: monthly_snapshot
    grain: one_month_end_warehouse_product_color_batch_record
    primary_key: [id]
    updated_at: gmt_modified
    allowed_columns: [id, bill_date, goods_num, piece_num, unit, cost_amount_rmb, cost_amount, ddp_amount_rmb, ddp_amount, currency_no, exchange_rate, unclosed_time, unclosed_days, goods_id, goods_no, goods_name, goods_sku_id, attr_val, color_label, batch_no, is_ht, is_print, is_ready, ready_type, whse_id, whse_name, whse_type, whse_dept, whse_region, whse_org, org_id, org_name]
    required_filters: []
    joins:
      - {target: vk_dwd.goods_detail_dwd, local: [goods_id], remote: [goods_id], cardinality: many_to_one, stage: after_fact_aggregation}
      - {target: vk_dwd.whse_info_dwd, local: [whse_id], remote: [whse_id], cardinality: many_to_one, stage: after_fact_aggregation}
    warnings:
      - Bind bill_date; negative piece_num can be valid accounting data.
      - id is the physical unique key; month plus warehouse/product/color/batch is not unique because legitimate currency, accounting-organization, unit, and cost layers can coexist.
      - whse_org is warehouse ownership while org_name is accounting organization; never silently merge them.
      - unclosed_days is a month-end no-movement/no-transaction field, not strict physical warehouse age.

