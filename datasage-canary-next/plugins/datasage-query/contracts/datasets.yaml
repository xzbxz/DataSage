    warnings:
      - Use only for salesperson target, collaboration, or explicitly allocated performance questions; ordinary refund and net receipt remain on the transaction-detail ledger.
      - No collaborator means one 100-percent row for the final salesperson; collaborators produce proportional rows.
      - This split table is authoritative for salesperson-allocation receipt refunds.
      - Transaction-detail base comparisons are diagnostic only; the Profile must not substitute, backfill, or mix the transaction-detail refund fact.

