version: datasage-mini-receivable-semantics/v9
domain: receivable
contract_role: plugin_physical_execution

tables:
  - vk_dwd.sale_bill_goods_detail_dwd
  - vk_dwd.receivable_bill_detail_dwd
  - vk_dw.customer_debt_bymonth_dw
  - vk_dwd.customer_aging_dwd
  - vk_dwd.customer_credit_dwd
  - vk_dwd.customer_dwd

facts:
  receivable_occurrence:
    table: vk_dwd.receivable_bill_detail_dwd
    grain: 一行是一条应收单明细
    primary_key: [detail_id]
    document_key: bill_id
    time_field: bill_time
    updated_at: gmt_modified
  debt_snapshot:
    table: vk_dw.customer_debt_bymonth_dw
    grain: 一行是一个月份、客户的欠款快照
    primary_key: [bill_date, customer_id]
    time_field: bill_date
  aging_snapshot:
    table: vk_dwd.customer_aging_dwd
    grain: 一行是一个月份、客户的账龄分桶记录
    primary_key: [bill_date, customer_id]
    time_field: bill_date
  credit_policy:
    table: vk_dwd.customer_credit_dwd
    grain: 一行是一条客户、组织、币种授信政策
    primary_key: [id]
    business_key: [customer_id, org_name, currency_no]
    updated_at: gmt_modified

value_contract_templates:
  entity_exact: &vc_entity_exact
    kind: entity_exact
    model_rule: 保留用户明确提供的精确实体 token；由工具做实体预检和稳定身份绑定，不得猜测。
  source_exact: &vc_source_exact
    kind: source_exact
    model_rule: 仅使用用户明确提供或受控结果返回的精确原值；不得猜测、翻译、归一化或扩展。
  boolean_yn: &vc_boolean_yn
    kind: closed
    allowed_values: [y, n]
    business_meanings: {y: 是, n: 否}

currency_policy_templates:
  original_currency: &original_currency_policy
    mode: original_currency
    column: currency_no
    require_filter_or_group: true
    never_sum_mixed_currency: true

dimensions:
  customer:
    label: 客户
    columns: [customer_id, customer_no, customer_name]
    filter_column: customer_name
    identity_filter: {entity_type: customer, value_field: canonical_id, column: customer_id}
    value_contract: *vc_entity_exact
  occurrence_salesperson:
    label: 应收发生业务员
    columns: [final_sales_id, final_sales_name]
    filter_column: final_sales_name
    identity_filter: {entity_type: salesperson, value_field: canonical_id, column: final_sales_id}
    value_contract: *vc_entity_exact
    answer_note: 应收发生与未结清明细的业务员归属按 final_sales_id、final_sales_name。
  snapshot_salesperson:
    label: 欠款快照业务员
    columns: [sales_id, sales_name]
    filter_column: sales_name
    identity_filter: {entity_type: salesperson, value_field: canonical_id, column: sales_id}
    value_contract: *vc_entity_exact
    answer_note: 欠款和账龄快照按快照 sales_id、sales_name；未知值保留，不用当前客户负责人补写。
  credit_salesperson:
    label: 授信业务员
    columns: [sales_id, sales_name]
    filter_column: sales_name
    identity_filter: {entity_type: salesperson, value_field: canonical_id, column: sales_id}
    value_contract: *vc_entity_exact
    answer_note: 授信政策按授信表 sales_id、sales_name。
  customer_department: &receivable_customer_department
    label: 客户部门
    columns: [customer_dept]
    filter_column: customer_dept
    value_contract: *vc_source_exact
    answer_note: 应收发生、未结清、欠款、账龄和授信均按客户所属部门。
  organization:
    label: 业务组织
    columns: [org_name]
    filter_column: org_name
    value_contract: *vc_source_exact
  occurrence_organization:
    label: 应收发生组织
    columns: [org_name]
    filter_column: org_name
    value_contract: *vc_source_exact
  settlement_organization:
    label: 结算组织
    columns: [settle_org_name]
    filter_column: settle_org_name
    value_contract: *vc_source_exact
  receipt_organization:
    label: 收款组织
    columns: [receive_org_name]
    filter_column: receive_org_name
    value_contract: *vc_source_exact
  sales_organization:
    label: 销售组织
    columns: [sale_org_name]
    filter_column: sale_org_name
    value_contract: *vc_source_exact
  customer_region:
    label: 客户区域
    columns: [customer_region]
    filter_column: customer_region
    value_contract: *vc_source_exact
  ccbs_customer:
    label: CCBS客户
    columns: [is_ccbs_cus]
    filter_column: is_ccbs_cus
    value_contract: *vc_boolean_yn
  ha_customer:
    label: HA客户
    columns: [is_ha_cus]
    filter_column: is_ha_cus
    value_contract: *vc_boolean_yn
  brand_customer:
    label: 品牌客户
    columns: [is_brand_cus]
    filter_column: is_brand_cus
    value_contract: *vc_boolean_yn
  ht_customer:
    label: HT客户
    columns: [is_ht_cus]
    filter_column: is_ht_cus
    value_contract: *vc_boolean_yn
  currency:
    label: 币种
    columns: [currency_no]
    filter_column: currency_no
    value_contract: *vc_source_exact
  receivable_type:
    label: 应收类型
    columns: [bill_type]
    filter_column: bill_type
    value_contract: *vc_source_exact
  product:
    label: 产品（仅分组）
    columns: [goods_no, goods_name]
    filter_column: goods_name
    value_contract:
      kind: source_exact
      filterable: false
      model_rule: 仅可作为受控分组结果，不接受 metric_filters；不得猜测或绑定产品实体。
    answer_note: 可用于分组展示；当前事实没有产品稳定主键，单产品实体过滤在产品编码唯一性得到治理前失败关闭。
  month:
    label: 月份
    columns: [bill_date]
    filter_column: bill_date
    value_contract: *vc_source_exact
  current_customer_grade:
    label: 当前客户等级
    columns: [{column: customer_grade, alias: current_customer_grade}]
    filter_column: customer_grade
    value_contract: *vc_source_exact
    source: {type: governed_join, dataset: vk_dwd.customer_dwd, local_column: customer_id, remote_column: customer_id, cardinality: many_to_one}
    answer_note: 当前客户等级只补充当前属性，不代表历史时点属性。
  current_customer_resource:
    label: 当前客户来源
    columns: [{column: customer_resource, alias: current_customer_resource}]
    filter_column: customer_resource
    value_contract: *vc_source_exact
    source: {type: governed_join, dataset: vk_dwd.customer_dwd, local_column: customer_id, remote_column: customer_id, cardinality: many_to_one}
    answer_note: 当前客户来源只补充当前属性，不代表历史时点属性。
  current_customer_business_label:
    label: 当前客户业务标签
    columns: [{column: biz_label, alias: current_customer_business_label}]
    filter_column: biz_label
    value_contract: *vc_source_exact
    source: {type: governed_join, dataset: vk_dwd.customer_dwd, local_column: customer_id, remote_column: customer_id, cardinality: many_to_one}
    answer_note: 当前客户业务标签只补充当前属性，不代表历史时点属性。
  current_customer_owner:
    label: 当前客户负责人
    columns:
      - {column: sales_id, alias: current_customer_owner_id}
      - {column: sales_name, alias: current_customer_owner_name}
    filter_column: sales_name
    value_contract: *vc_source_exact
    source: {type: governed_join, dataset: vk_dwd.customer_dwd, local_column: customer_id, remote_column: customer_id, cardinality: many_to_one}
    answer_note: 当前客户负责人只用于补充当前属性，不替代事实或快照中的业务员归属。

  department: *receivable_customer_department
  salesperson:
    label: 业务员
    columns:
    - column: final_sales_id
      alias: sales_id
    - column: final_sales_name
      alias: sales_name
    filter_column: final_sales_name
    identity_filter:
      entity_type: salesperson
      value_field: canonical_id
      column: final_sales_id
    value_contract:
      kind: entity_exact
      model_rule: 保留用户明确提供的精确实体 token；由工具做实体预检和稳定身份绑定，不得猜测。

current_customer_dimensions: &current_customer_dimensions
  [current_customer_grade, current_customer_resource, current_customer_business_label, current_customer_owner]
occurrence_dimensions: &occurrence_dimensions
  [customer, occurrence_salesperson, customer_department, occurrence_organization, settlement_organization, receipt_organization, sales_organization, customer_region, ccbs_customer, currency, receivable_type, product, current_customer_grade, current_customer_resource, current_customer_business_label, current_customer_owner]
snapshot_dimensions: &snapshot_dimensions
  [customer, snapshot_salesperson, customer_department, organization, customer_region, ccbs_customer, ha_customer, brand_customer, ht_customer, currency, month, current_customer_grade, current_customer_resource, current_customer_business_label, current_customer_owner]
aging_dimensions: &aging_dimensions
  [customer, snapshot_salesperson, customer_department, organization, customer_region, ccbs_customer, ha_customer, currency, month, current_customer_grade, current_customer_resource, current_customer_business_label, current_customer_owner]
credit_dimensions: &credit_dimensions
  [customer, credit_salesperson, customer_department, organization, customer_region, currency, current_customer_grade, current_customer_resource, current_customer_business_label, current_customer_owner]

credit_policy_join: &credit_policy_join
  dataset: vk_dwd.customer_credit_dwd
  local_columns: [customer_id, org_name, currency_no]
  remote_columns: [customer_id, org_name, currency_no]
  cardinality: many_to_one

current_customer_scope_join: &current_customer_scope_join
  dataset: vk_dwd.customer_dwd
  local_columns: [customer_id]
  remote_columns: [customer_id]
  cardinality: many_to_one
  required_filters: {is_inner_cus: {op: eq, value: n}}

default_disclosures:
  - id: receivable.external-customer.scope
    mode: required_always
    text: "应收域指标固定排除内部客户。"

metrics:
  receivable_occurrence_amount:
    disclosures:
      - id: receivable.occurrence.scope
        mode: required_always
        text: "应收发生额包含正负应收类型，并排除A状态和内部客户。"
      - id: receivable.receivable_occurrence_amount.legacy-note
        mode: contract_only
        text: &answer_note_receivable_occurrence_amount "应收发生额包含正负应收类型，排除 A 状态和内部客户，默认人民币。"
    label: 应收发生额（人民币）
    business_definition: 所选应收发生期间内的人民币应收发生额，包含全部应收类型，并按治理范围排除无效状态和内部客户。
    unit: 人民币元
    table: vk_dwd.receivable_bill_detail_dwd
    aggregation: sum
    measure: detail_receivable_rmb
    time_field: bill_time
    time_policy: current_month
    required_filters: {bill_status: {op: ne, value: A}}
    allowed_dimensions: *occurrence_dimensions
    answer_note: *answer_note_receivable_occurrence_amount
  receivable_occurrence_amount_original:
    disclosures:
      - id: currency.original.no-cross-currency
        mode: required_always
        text: "原币金额必须限定单一币种或按币种分组，不同币种不得直接相加。"
      - id: receivable.receivable_occurrence_amount_original.legacy-note
        mode: contract_only
        text: &answer_note_receivable_occurrence_amount_original "原币应收必须限定单一币种或按 currency_no 分组。"
    label: 应收发生额（原币）
    business_definition: 所选应收发生期间内的原币应收发生额；必须按币种筛选或分组，不得跨币种相加。
    unit: 原币金额（按币种分别计量）
    table: vk_dwd.receivable_bill_detail_dwd
    aggregation: sum
    measure: detail_receivable_amount
    currency_policy: *original_currency_policy
    time_field: bill_time
    time_policy: current_month
    required_filters: {bill_status: {op: ne, value: A}}
    allowed_dimensions: *occurrence_dimensions
    answer_note: *answer_note_receivable_occurrence_amount_original
  receivable_bill_count:
    disclosures:
      - id: receivable.receivable_bill_count.legacy-note
        mode: contract_only
        text: &answer_note_receivable_bill_count "应收单数按 bill_id 非重复计数。"
    label: 应收单数
    business_definition: 所选应收发生期间和治理范围内的非重复应收单数量。
    unit: 单
    table: vk_dwd.receivable_bill_detail_dwd
    aggregation: count_distinct
    measure: bill_id
    time_field: bill_time
    time_policy: current_month
    required_filters: {bill_status: {op: ne, value: A}}
    allowed_dimensions: *occurrence_dimensions
    answer_note: *answer_note_receivable_bill_count
  receivable_customer_count:
    disclosures: []
    label: 应收客户数
    business_definition: 所选应收发生期间和治理范围内产生应收的非重复客户数量。
    unit: 客户
    table: vk_dwd.receivable_bill_detail_dwd
    aggregation: count_distinct
    measure: customer_id
    time_field: bill_time
    time_policy: current_month
    required_filters: {bill_status: {op: ne, value: A}}
    allowed_dimensions: *occurrence_dimensions
  receivable_quantity:
    disclosures: []
    availability:
      status: pending_validation
      error_code: SEMANTIC_UNIT_RECONCILIATION_REQUIRED
      message: 应收商品数量尚未提供可执行单位筛选或分组，完成单位口径核验前不可用于回答。
      owner: datasage.data_governance.receivable
      activation_gate:
        state: blocked
        required_evidence:
          - executable_unit_filter_or_group_contract
          - production_read_only_reconciliation
          - mixed_unit_regression
        activation_authority: owner_and_release_review
      review:
        cadence: every_release_candidate
        triggers: [source_schema_change, unit_contract_change]
      lifecycle:
        state: pending_validation
        activation_effect: remains_unavailable_until_gate_passes
        retirement_rule: retire_if_owner_or_validation_plan_removed
    label: 应收商品数量
    business_definition: 所选应收发生期间和治理范围内的应收商品业务数量。
    unit_policy: 来源业务数量单位；当前合同不提供单位拆分，不得解释为可跨单位换算的统一物理数量
    table: vk_dwd.receivable_bill_detail_dwd
    aggregation: sum
    measure: goods_num
    time_field: bill_time
    time_policy: current_month
    required_filters: {bill_status: {op: ne, value: A}}
    allowed_dimensions: *occurrence_dimensions
  receivable_piece_count:
    disclosures: []
    label: 应收卷数
    business_definition: 所选应收发生期间和治理范围内的应收商品卷数。
    unit: 卷
    table: vk_dwd.receivable_bill_detail_dwd
    aggregation: sum
    measure: piece_num
    time_field: bill_time
    time_policy: current_month
    required_filters: {bill_status: {op: ne, value: A}}
    allowed_dimensions: *occurrence_dimensions

  open_receivable_amount:
    disclosures:
      - id: receivable.open_receivable.scope
        mode: required_always
        text: "未结清的判定依据是正数未结余额，不是核销状态。"
      - id: receivable.open_receivable_amount.legacy-note
        mode: contract_only
        text: &answer_note_open_receivable_amount "未结清按 detail_unsettled_amount > 0 判定，不使用核销状态；该指标不是当前欠款余额。"
    label: 未结清应收（人民币）
    business_definition: 当前仍有正数未结清余额的应收项目，按治理汇率折算后的人民币金额；不等同于欠款快照余额。
    unit: 人民币元
    table: vk_dwd.receivable_bill_detail_dwd
    aggregation: sum_product
    measure_columns: [detail_unsettled_amount, exchange_rate]
    time_policy: current_snapshot
    required_filters: {bill_status: {op: ne, value: A}, detail_unsettled_amount: {op: gt, value: 0}}
    allowed_dimensions: *occurrence_dimensions
    answer_note: *answer_note_open_receivable_amount
  open_receivable_amount_original:
    disclosures:
      - id: currency.original.no-cross-currency
        mode: required_always
        text: "原币金额必须限定单一币种或按币种分组，不同币种不得直接相加。"
      - id: receivable.open_receivable_amount_original.legacy-note
        mode: contract_only
        text: &answer_note_open_receivable_amount_original "未结清原币必须限定单一币种或按 currency_no 分组。"
    label: 未结清应收（原币）
    business_definition: 当前仍有正数未结清余额的应收项目原币金额；必须按币种筛选或分组，不得跨币种相加。
    unit: 原币金额（按币种分别计量）
    table: vk_dwd.receivable_bill_detail_dwd
    aggregation: sum
    measure: detail_unsettled_amount
    currency_policy: *original_currency_policy
    time_policy: current_snapshot
    required_filters: {bill_status: {op: ne, value: A}, detail_unsettled_amount: {op: gt, value: 0}}
    allowed_dimensions: *occurrence_dimensions
    answer_note: *answer_note_open_receivable_amount_original
  open_receivable_bill_count:
    disclosures: []
    label: 未结清应收单数
    business_definition: 当前仍有正数未结清余额的非重复应收单数量。
    unit: 单
    table: vk_dwd.receivable_bill_detail_dwd
    aggregation: count_distinct
    measure: bill_id
    time_policy: current_snapshot
    required_filters: {bill_status: {op: ne, value: A}, detail_unsettled_amount: {op: gt, value: 0}}
    allowed_dimensions: *occurrence_dimensions
  open_receivable_customer_count:
    disclosures: []
    label: 未结清应收客户数
    business_definition: 当前至少有一笔正数未结清应收的非重复客户数量。
    unit: 客户
    table: vk_dwd.receivable_bill_detail_dwd
    aggregation: count_distinct
    measure: customer_id
    time_policy: current_snapshot
    required_filters: {bill_status: {op: ne, value: A}, detail_unsettled_amount: {op: gt, value: 0}}
    allowed_dimensions: *occurrence_dimensions
  earliest_open_receivable_date:
    disclosures: []
    label: 最早未结清应收日期
    business_definition: 当前正数未结清应收范围内最早的应收发生日期。
    unit: 日期
    table: vk_dwd.receivable_bill_detail_dwd
    aggregation: min
    measure: bill_time
    time_policy: current_snapshot
    required_filters: {bill_status: {op: ne, value: A}, detail_unsettled_amount: {op: gt, value: 0}}
    allowed_dimensions: *occurrence_dimensions
  debt_days:
    disclosures:
      - id: receivable.debt_days.legacy-note
        mode: contract_only
        text: &answer_note_debt_days "欠款天数按 DATEDIFF(CURDATE(), MIN(bill_time))，仅使用正数未结清应收明细。"
    label: 欠款天数
    business_definition: 从当前最早一笔正数未结清应收的发生日期到今天的自然日数。
    unit: 自然日
    table: vk_dwd.receivable_bill_detail_dwd
    aggregation: days_since_min
    measure: bill_time
    time_policy: current_snapshot
    required_filters: {bill_status: {op: ne, value: A}, detail_unsettled_amount: {op: gt, value: 0}}
    allowed_dimensions: *occurrence_dimensions
    answer_note: *answer_note_debt_days

  current_debt_amount:
    disclosures:
      - id: receivable.current-debt.snapshot-meaning
        mode: required_always
        text: "当前欠款是最新月签名净欠款，包含正数、负数和零值；负数不代表已经确认的具体业务原因。"
      - id: receivable.current_debt_amount.legacy-note
        mode: contract_only
        text: &answer_note_current_debt_amount "当前欠款默认是最新月签名净欠款，包含正数、负数和零值；负数不解释成具体原因。"
    label: 当前净欠款（人民币）
    business_definition: 最新可用欠款快照中的人民币净欠款余额，保留正数、负数和零的业务含义。
    unit: 人民币元
    table: vk_dw.customer_debt_bymonth_dw
    aggregation: sum
    measure: debt_amount_rmb
    time_field: bill_date
    time_policy: latest_snapshot
    required_filters: {}
    allowed_dimensions: *snapshot_dimensions
    answer_note: *answer_note_current_debt_amount
  current_debt_amount_original:
    disclosures:
      - id: currency.original.no-cross-currency
        mode: required_always
        text: "原币金额必须限定单一币种或按币种分组，不同币种不得直接相加。"
      - id: receivable.current_debt_amount_original.legacy-note
        mode: contract_only
        text: &answer_note_current_debt_amount_original "原币欠款必须限定单一币种或按 currency_no 分组。"
    label: 当前净欠款（原币）
    business_definition: 最新可用欠款快照中的原币净欠款余额，保留正负值；必须按币种筛选或分组，不得跨币种相加。
    unit: 原币金额（按币种分别计量）
    table: vk_dw.customer_debt_bymonth_dw
    aggregation: sum
    measure: debt_amount
    currency_policy: *original_currency_policy
    time_field: bill_date
    time_policy: latest_snapshot
    required_filters: {}
    allowed_dimensions: *snapshot_dimensions
    answer_note: *answer_note_current_debt_amount_original
  positive_debt_amount:
    disclosures:
      - id: receivable.positive_debt_amount.legacy-note
        mode: contract_only
        text: &answer_note_positive_debt_amount "“哪些客户欠我们”只看 debt_amount_rmb > 0，负数和零不进入名单及排名。"
    label: 正欠款金额（人民币）
