  overdue_receivable_amount:
    disclosures:
      - id: receivable.overdue.credit-coverage
        mode: required_always
        text: &overdue_coverage_note "覆盖基于本次筛选内正未结记录。账期或日期缺失记为无法判定。存在无法判定记录或逾期记录缺少指标必需输入时，总体值未定义；子集值只汇总已判定逾期且输入齐全的记录。资格覆盖的分母为范围记录数，指标贡献覆盖的分母为已判定逾期及无法判定记录数；两者不代表源数据同步或结账状态。"
      - id: receivable.overdue_receivable_amount.legacy-note
        mode: contract_only
        text: &answer_note_overdue_receivable_amount "逾期按客户、组织、币种授信天数逐笔判断；无授信或授信天数为空的明细不计入，需说明覆盖范围。"
    label: 逾期应收金额（人民币）
    business_definition: 截至数据库查询日，当前正数未结清应收中超过适用授信天数的部分按治理汇率折算后的人民币金额。
    unit: 人民币元
    table: vk_dwd.receivable_bill_detail_dwd
    aggregation: sum_product
    measure_columns: [detail_unsettled_amount, exchange_rate]
    time_policy: current_snapshot
    current_snapshot_evidence: database_current_date
    required_filters: {bill_status: {op: ne, value: A}, detail_unsettled_amount: {op: gt, value: 0}}
    metric_join:
      <<: *credit_policy_join
      required_not_null: [credit_days]
      condition: {type: date_plus_days_before_today, date_column: bill_time, days_column: credit_days}
    allowed_dimensions: *occurrence_dimensions
    answer_note: *answer_note_overdue_receivable_amount
  overdue_receivable_amount_original:
    disclosures:
      - id: receivable.overdue.credit-coverage
        mode: required_always
        text: *overdue_coverage_note
    label: 逾期应收金额（原币）
    business_definition: 当前正数未结清应收中，超过适用授信天数的原币金额；必须按币种筛选或分组，不得跨币种相加。
    unit: 原币金额（按币种分别计量）
    table: vk_dwd.receivable_bill_detail_dwd
    aggregation: sum
    measure: detail_unsettled_amount
    currency_policy: *original_currency_policy
    time_policy: current_snapshot
    required_filters: {bill_status: {op: ne, value: A}, detail_unsettled_amount: {op: gt, value: 0}}
    metric_join:
      <<: *credit_policy_join
      required_not_null: [credit_days]
      condition: {type: date_plus_days_before_today, date_column: bill_time, days_column: credit_days}
    allowed_dimensions: *occurrence_dimensions
  overdue_customer_count:
    disclosures:
      - id: receivable.overdue.credit-coverage
        mode: required_always
        text: *overdue_coverage_note
    label: 逾期客户数
    business_definition: 当前至少有一笔正数未结清应收超过适用授信天数的非重复客户数量。
    unit: 客户
    table: vk_dwd.receivable_bill_detail_dwd
    aggregation: count_distinct
    measure: customer_id
    time_policy: current_snapshot
    required_filters: {bill_status: {op: ne, value: A}, detail_unsettled_amount: {op: gt, value: 0}}
    metric_join:
      <<: *credit_policy_join
      required_not_null: [credit_days]
      condition: {type: date_plus_days_before_today, date_column: bill_time, days_column: credit_days}
    allowed_dimensions: *occurrence_dimensions
  overdue_days:
    disclosures:
      - id: receivable.overdue.credit-coverage
        mode: required_always
        text: *overdue_coverage_note
      - id: receivable.overdue_days.legacy-note
        mode: contract_only
        text: &answer_note_overdue_days "逾期天数是最大逐笔逾期天数；无授信或授信天数为空的客户不进入计算。"
    label: 逾期天数
    business_definition: 当前正数未结清应收超过适用授信天数的最大自然日数；未超过时不作为正逾期天数。
    unit: 自然日
    table: vk_dwd.receivable_bill_detail_dwd
    aggregation: max_days_over
    measure: bill_time
    subtract_measure: credit_days
    time_policy: current_snapshot
    required_filters: {bill_status: {op: ne, value: A}, detail_unsettled_amount: {op: gt, value: 0}}
    metric_join:
      <<: *credit_policy_join
      required_not_null: [credit_days]
      condition: {type: date_plus_days_before_today, date_column: bill_time, days_column: credit_days}
    allowed_dimensions: *occurrence_dimensions
    answer_note: *answer_note_overdue_days

  excess_credit_amount:
    disclosures:
      - id: receivable.excess-credit.calculation-and-coverage
        mode: required_always
        text: "超授信金额按正欠款超过授信金额的部分计算，负差额归零；无授信记录或授信金额为空的客户不计入，另由无授信有欠款指标单列。"
      - id: receivable.excess_credit_amount.legacy-note
        mode: contract_only
        text: "按最新欠款快照逐行计算 GREATEST(debt_amount - credit_amount, 0) × exchange_rate；授信金额为空的行不进入计算。"
    label: 超授信金额（人民币）
    business_definition: 最新欠款快照中正欠款超过授信金额的人民币部分；负差额按零处理，不含无授信记录或授信金额为空的客户。
    unit: 人民币元
    formula: SUM(GREATEST(debt_amount - credit_amount, 0) * exchange_rate)
    table: vk_dw.customer_debt_bymonth_dw
    aggregation: sum_positive_difference_product
    measure: debt_amount
    subtract_measure: credit_amount
    multiplier: exchange_rate
    time_field: bill_date
    time_policy: latest_snapshot
    required_filters: {debt_amount: {op: gt, value: 0}}
    metric_join:
      <<: *credit_policy_join
      required_not_null: [credit_amount]
    allowed_dimensions: *snapshot_dimensions
    answer_note: 超授信金额负差额归零；无授信记录或授信金额为空的客户不混入本指标。
  excess_credit_amount_original:
    disclosures:
      - id: currency.original.no-cross-currency
        mode: required_always
        text: "原币金额必须限定单一币种或按币种分组，不同币种不得直接相加。"
      - id: receivable.excess-credit.calculation-and-coverage
        mode: required_always
        text: "超授信金额按正欠款超过授信金额的部分计算，负差额归零；无授信记录或授信金额为空的客户不计入，另由无授信有欠款指标单列。"
      - id: receivable.excess_credit_amount_original.legacy-note
        mode: contract_only
        text: "逐行计算 GREATEST(debt_amount - credit_amount, 0)；授信金额为空的行不进入计算。"
    label: 超授信金额（原币）
    business_definition: 最新欠款快照中正欠款超过授信金额的原币部分；负差额按零处理，不含无授信记录或授信金额为空的客户；必须按币种筛选或分组，不得跨币种相加。
    unit: 原币金额（按币种分别计量）
    table: vk_dw.customer_debt_bymonth_dw
    aggregation: sum_positive_difference
    measure: debt_amount
    subtract_measure: credit_amount
    currency_policy: *original_currency_policy
    time_field: bill_date
    time_policy: latest_snapshot
    required_filters: {debt_amount: {op: gt, value: 0}}
    metric_join:
      <<: *credit_policy_join
      required_not_null: [credit_amount]
    allowed_dimensions: *snapshot_dimensions
    answer_note: 原币超授信金额必须限定单一币种或按 currency_no 分组；负差额归零；无授信或授信金额为空的客户不计入。
  uncredited_positive_debt_amount:
    disclosures:
      - id: receivable.uncredited_positive_debt_amount.legacy-note
        mode: contract_only
        text: &answer_note_uncredited_positive_debt_amount "本指标单列无授信记录的正欠款，不与超账期金额混算。"
    label: 无授信有欠款金额（人民币）
    business_definition: 最新欠款快照中存在正数欠款、但在相同客户组织与币种范围内没有授信记录的人民币金额。
    unit: 人民币元
    table: vk_dw.customer_debt_bymonth_dw
    aggregation: sum_positive
    measure: debt_amount_rmb
    time_field: bill_date
    time_policy: latest_snapshot
    required_filters: {debt_amount_rmb: {op: gt, value: 0}}
    metric_join:
      <<: *credit_policy_join
      required_missing: id
    allowed_dimensions: *snapshot_dimensions
    answer_note: *answer_note_uncredited_positive_debt_amount
  uncredited_debt_customer_count:
    disclosures:
      - id: receivable.uncredited_debt_customer_count.legacy-note
        mode: contract_only
        text: &answer_note_uncredited_debt_customer_count "按 customer_id 非重复计数；同一客户多个无授信币种仍只计一个客户。"
    label: 无授信有欠款客户数
    business_definition: 最新欠款快照中存在正数欠款、但在相同客户组织与币种范围内没有授信记录的非重复客户数量。
    unit: 客户
    table: vk_dw.customer_debt_bymonth_dw
    aggregation: count_distinct
    measure: customer_id
    time_field: bill_date
    time_policy: latest_snapshot
    required_filters: {debt_amount_rmb: {op: gt, value: 0}}
    metric_join:
      <<: *credit_policy_join
      required_missing: id
    allowed_dimensions: *snapshot_dimensions
    answer_note: *answer_note_uncredited_debt_customer_count
  credit_amount_original:
    disclosures:
      - id: currency.original.no-cross-currency
        mode: required_always
        text: "原币金额必须限定单一币种或按币种分组，不同币种不得直接相加。"
      - id: receivable.credit_amount_original.legacy-note
        mode: contract_only
        text: &answer_note_credit_amount_original "授信金额按客户、组织、币种维护，不同币种不得直接相加；当前内部客户按客户主数据排除。"
    label: 授信金额（原币）
    business_definition: 当前客户组织与币种范围内维护的原币授信金额；必须按币种筛选或分组，不得跨币种相加。
    unit: 原币金额（按币种分别计量）
    table: vk_dwd.customer_credit_dwd
    aggregation: sum
    measure: credit_amount
    currency_policy: *original_currency_policy
    time_policy: current_snapshot
    required_filters: {}
    metric_join: *current_customer_scope_join
    allowed_dimensions: *credit_dimensions
    answer_note: *answer_note_credit_amount_original
  credit_days:
    disclosures:
      - id: receivable.credit_days.legacy-note
        mode: contract_only
        text: &answer_note_credit_days "查询授信天数时应限定或按客户、组织、币种分组；空值表示未知，不按零处理；当前内部客户按客户主数据排除。"
    label: 授信天数
    business_definition: 当前客户组织与币种范围内维护的授信账期天数；缺失表示未知，不按零处理。
    unit: 自然日
    table: vk_dwd.customer_credit_dwd
    aggregation: max
    measure: credit_days
    time_policy: current_snapshot
    required_filters: {}
    metric_join: *current_customer_scope_join
    allowed_dimensions: *credit_dimensions
    answer_note: *answer_note_credit_days

  average_settlement_days:
    disclosures:
      - id: receivable.settlement.sample-coverage
        mode: required_always
        text: "历史结算天数仅覆盖已完成且通过异常校验的应收单，不代表当前未结算压力。"
      - id: receivable.average_settlement_days.legacy-note
        mode: contract_only
        text: &answer_note_average_settlement_days "按非重复应收单计算；排除结算天数为负以及结算完成后仍有正数未结余额的异常单据。"
    label: 平均实际结算天数
    business_definition: 在所选已完成结算应收单范围内，从应收发生日期到结算完成日期的自然日数平均值；未结清应收不纳入。
    unit: 自然日
    query_kind: settlement_days
    dimension_overrides: &settlement_customer_projection
      customer:
        label: 客户
        columns:
        - customer_id
        - customer_name
        filter_column: customer_name
        identity_filter:
          entity_type: customer
          value_field: canonical_id
          column: customer_id
        value_contract:
          kind: entity_exact
          model_rule: 保留用户明确提供的精确实体 token；由工具做实体预检和稳定身份绑定，不得猜测。
    max_group_dimensions: 2
    statistic: average
    table: vk_dwd.receivable_bill_detail_dwd
    document_key: bill_id
    bill_time_field: bill_time
    completion_time_field: verification_complete_time
    open_amount_field: detail_unsettled_amount
    time_policy: last_12_completed_months
    required_filters:
      bill_status: {op: ne, value: A}
      is_inner_cus: {op: eq, value: n}
    allowed_dimensions: [customer, salesperson, department, organization]
    answer_note: *answer_note_average_settlement_days

  maximum_settlement_days:
    disclosures:
      - id: receivable.settlement.sample-coverage
        mode: required_always
        text: "历史结算天数仅覆盖已完成且通过异常校验的应收单，不代表当前未结算压力。"
      - id: receivable.maximum_settlement_days.legacy-note
        mode: contract_only
        text: &answer_note_maximum_settlement_days "最大值只反映已完成结算单据；不能替代当前未结算压力。"
    label: 最大实际结算天数
    business_definition: 在所选已完成结算应收单范围内，单笔实际结算自然日数的最大值；未结清应收不纳入。
    unit: 自然日
    query_kind: settlement_days
    dimension_overrides: *settlement_customer_projection
    max_group_dimensions: 2
    statistic: maximum
    table: vk_dwd.receivable_bill_detail_dwd
    document_key: bill_id
    bill_time_field: bill_time
    completion_time_field: verification_complete_time
    open_amount_field: detail_unsettled_amount
    time_policy: last_12_completed_months
    required_filters:
      bill_status: {op: ne, value: A}
      is_inner_cus: {op: eq, value: n}
    allowed_dimensions: [customer, salesperson, department, organization]
    answer_note: *answer_note_maximum_settlement_days

  settlement_days_distribution:
    disclosures:
      - id: receivable.settlement.sample-coverage
        mode: required_always
        text: "历史结算天数仅覆盖已完成且通过异常校验的应收单，不代表当前未结算压力。"
      - id: receivable.settlement_days_distribution.legacy-note
        mode: contract_only
        text: &answer_note_settlement_days_distribution "分布按应收单而不是明细行计数；未结算单据不进入历史结算分布。"
    label: 实际结算天数分布
    business_definition: 将所选已完成结算应收单按实际结算自然日数分档，并统计各档的非重复应收单数量。
    unit_policy: 结算时长按自然日；各分档计数单位为应收单
    query_kind: settlement_days
    dimension_overrides: *settlement_customer_projection
    max_group_dimensions: 2
    statistic: distribution
    table: vk_dwd.receivable_bill_detail_dwd
    document_key: bill_id
    bill_time_field: bill_time
    completion_time_field: verification_complete_time
    open_amount_field: detail_unsettled_amount
    time_policy: last_12_completed_months
    required_filters:
      bill_status: {op: ne, value: A}
      is_inner_cus: {op: eq, value: n}
    allowed_dimensions: [customer, salesperson, department, organization]
    answer_note: *answer_note_settlement_days_distribution

  formal_receivable_turnover_days:
    disclosures:
      - id: receivable.formal-receivable-turnover.coverage
        mode: required_always
        text: &answer_note_formal_receivable_turnover_days "未指定期间时默认最近12个完整且已结束的自然月；指定月份或完整期间时按所选N个月计算，需要覆盖期初至期末的连续N+1个月末净欠款余额；真实零余额正常计入，缺失记录不自动补零。期间毛出库合计须为正，不要求每个月都有正出库。出库按范围内已记录的有效明细汇总，未证明源系统采集完整性。没有公司目标天数时，不与30天或其他假设目标比较。"
      - id: receivable.formal-receivable-turnover.external-customer.scope
        mode: required_always
        text: "正式应收周转天数的月末净欠款和毛出库分母均固定排除内部客户。"
      - id: receivable.formal-receivable-turnover.formula
        mode: required_always
        text: "正式应收周转天数按平均月末净欠款除以同期毛出库金额，再乘期间自然日数计算。结果表示平均净欠款相当于同期日均毛出库的多少天，可为正、零或负；负值表示净负余额的折合规模，不代表提前付款天数，具体成因需另查证据；零值可能来自零余额或正负抵消，不证明没有未收款项。"
      - id: receivable.formal_receivable_turnover_days.legacy-note
        mode: contract_only
        text: *answer_note_formal_receivable_turnover_days
    label: 正式应收周转天数
    business_definition: 按本企业净额口径，将所选完整且已结束期间的平均净经营欠款折合为同期日均毛出库的天数，不等同逐笔付款耗时；未指定时默认最近12个月，指定单月仅计算该月。
    answer_contract:
      - "正式应收周转天数的有效数值与组成项以查询返回的状态为准；未定义表示当前证据不足以形成该指标，不等于查询执行失败。"
      - "覆盖、公式及双侧外部客户范围以本次结果中的适用披露为准；目录说明本身不是已查询的经营事实。"
    unit: 自然日
    query_kind: formal_dso
    max_group_dimensions: 1
    debt_table: vk_dw.customer_debt_bymonth_dw
    debt_time_field: bill_date
    debt_measure: debt_amount_rmb
    delivery_table: vk_dwd.sale_bill_goods_detail_dwd
    delivery_time_field: delivery_time
    delivery_measure: delivery_amount_rmb
    time_policy: last_12_completed_months
    debt_required_filters:
      is_inner_cus: {op: eq, value: n}
    delivery_required_filters:
      bill_status: {op: eq, value: 6}
      is_inner_cus: {op: eq, value: n}
    allowed_dimensions: [customer, salesperson, department, organization]
    dimension_mappings:
      customer:
        debt_key: customer_id
        delivery_key: customer_id
        debt_filter: customer_name
        delivery_filter: customer_name
        debt_outputs:
          - {column: customer_id, alias: customer_id}
          - {column: customer_name, alias: customer_name}
        delivery_outputs: []
      salesperson:
        debt_key: sales_id
        delivery_key: sales_id
        debt_filter: sales_name
        delivery_filter: sales_name
        debt_outputs:
          - {column: sales_id, alias: sales_id}
          - {column: sales_name, alias: sales_name}
        delivery_outputs: []
      department:
        debt_key: customer_dept
        delivery_key: customer_dept
        debt_filter: customer_dept
        delivery_filter: customer_dept
        debt_outputs:
          - {column: customer_dept, alias: customer_dept}
        delivery_outputs: []
      organization:
        debt_key: org_name
        delivery_key: org_name
        debt_filter: org_name
        delivery_filter: org_name
        debt_outputs:
          - {column: org_name, alias: org_name}
        delivery_outputs: []
    answer_note: *answer_note_formal_receivable_turnover_days

