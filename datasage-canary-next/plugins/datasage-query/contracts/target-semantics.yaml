version: datasage-mini-target-semantics/v12
domain: target
contract_role: plugin_physical_execution
target_gap_decomposition_contract: contracts/target-gap-decomposition.yaml
business_name: 目标完成证据分析
tables: [vk_dwd.delivery_target_split_dwd, vk_dwd.sale_bill_split_dwd, vk_dwd.delivery_return_detail_dwd, vk_dwd.receive_target_split_dwd, vk_dwd.receive_bill_split_dwd, vk_dwd.receive_return_bill_split_dwd, vk_dwd.receive_return_bill_detail_dwd, vk_dwd.delivery_target_detail_dwd, vk_dwd.sale_bill_goods_detail_dwd, vk_dwd.receive_target_dwd, vk_dwd.receive_bill_detail_dwd]
defaults:
  time_scope: current_month
  currency: RMB
  ranking_limit: 10
  zero_target_completion_rate: null
  attribution_mode_required: true
  max_business_dimensions: 5
  monthly_trend_bucket: month
  name_alignment: exact
  current_month_progress: full_month_target_vs_actual_to_date
  future_period_behavior: target_only
  trend_without_time: latest_6_natural_months_including_current
  mixed_past_current_future: monthly_breakdown_required
  missing_target_display: 未设置目标
ledger_policy:
  transaction_detail:
    use_for: [ordinary_target, customer_target, department_target, organization_target, overall_target]
  salesperson_allocation:
    use_for: [salesperson_target, collaboration, allocation, allocated_performance]
    etl_contract: [complete_base_coverage, unique_allocation_key, no_orphans, amount_reconciliation]
  runtime_policy: disable_until_production_read_only_reconciliation_passes
dimensions:
  salesperson: {label: 业务员, columns: [sales_id, sales_name], filter_column: sales_name, identity_filter: {entity_type: salesperson, value_field: canonical_id, column: sales_id}, value_contract: {kind: entity_exact, model_rule: 保留用户明确提供的精确实体 token；由工具做实体预检和稳定身份绑定，不得猜测。}}
  department: {label: 客户部门, columns: [customer_dept], filter_column: customer_dept, value_contract: {kind: source_exact, model_rule: 仅使用用户明确提供或受控结果返回的精确原值；不得猜测、翻译、归一化或扩展。}}
  organization: {label: 业务组织, columns: [org_name], filter_column: org_name, value_contract: {kind: source_exact, model_rule: 仅使用用户明确提供或受控结果返回的精确原值；不得猜测、翻译、归一化或扩展。}}
  customer: {label: 客户, columns: [customer_id, customer_name], filter_column: customer_name, identity_filter: {entity_type: customer, value_field: canonical_id, column: customer_id}, value_contract: {kind: entity_exact, model_rule: 保留用户明确提供的精确实体 token；由工具做实体预检和稳定身份绑定，不得猜测。}}
metrics:
  delivery_allocated_target_amount:
    disclosures: []
    availability: &allocation_pending_reconciliation
      status: pending_validation
      error_code: DATA_RECONCILIATION_REQUIRED
      message: 业务员分摊数据尚未完成生产只读对账，当前不能用于回答。
    label: 业务员分摊口径出库目标金额
    business_definition: 所选期间按业务员目标分摊归属统计的出库目标人民币金额；用于业务员目标、协作或分摊场景。
    unit: 人民币元
    table: vk_dwd.delivery_target_split_dwd
    aggregation: sum
    measure: detail_target_rmb
    time_field: year_month
    time_policy: current_month
    time_granularity: month
    required_filters: {is_inner_cus: {op: eq, value: n}}
    allowed_dimensions: [salesperson, department, organization]
    required_attribution_mode: salesperson_allocation
  receipt_allocated_target_amount:
    disclosures: []
    availability: *allocation_pending_reconciliation
    label: 业务员分摊口径收款目标金额
    business_definition: 所选期间按业务员目标分摊归属统计的收款目标人民币金额；用于业务员目标、协作或分摊场景。
    unit: 人民币元
    table: vk_dwd.receive_target_split_dwd
    aggregation: sum
    measure: plan_receive_rmb
    time_field: plan_receive_time
    time_policy: current_month
    required_filters: {}
    allowed_dimensions: [salesperson, department, organization]
    required_attribution_mode: salesperson_allocation
  delivery_target_amount:
    disclosures: []
    label: 交易事实账口径出库目标金额
    business_definition: 所选期间按普通交易归属统计的出库目标人民币金额，适用于总体、客户、部门和组织目标。
    unit: 人民币元
    table: vk_dwd.delivery_target_detail_dwd
    aggregation: sum
    measure: detail_target_rmb
    time_field: year_month
    time_policy: current_month
    time_granularity: month
    required_filters: {is_inner_cus: {op: eq, value: n}}
    allowed_dimensions: [customer, department, organization]
    required_attribution_mode: transaction_detail
  receipt_target_amount:
    disclosures: []
    label: 交易事实账口径收款目标金额
    business_definition: 所选期间按普通交易归属统计的收款目标人民币金额，适用于总体、客户、部门和组织目标。
    unit: 人民币元
    table: vk_dwd.receive_target_dwd
    aggregation: sum
    measure: plan_receive_rmb
    time_field: plan_receive_time
    time_policy: current_month
    required_filters: {}
    allowed_dimensions: [customer, department, organization]
    required_attribution_mode: transaction_detail
  allocated_net_delivery_amount:
    disclosures:
      - id: target.allocated_net_delivery_amount.legacy-note
        mode: contract_only
        text: "分摊净出库为拆分毛出库减退货事实金额；退货按退货事实业务员100%归属，排除内部客户。"
    availability: *allocation_pending_reconciliation
    label: 业务员分摊口径净出库金额
    business_definition: 所选期间按业务员分摊归属统计的净出库人民币实际金额；出库目标与实际均排除内部客户。
    unit: 人民币元
    query_kind: allocated_amount
    max_group_dimensions: 2
    source_completion_metric: delivery_target_completion
    source_path: salesperson_allocation
    time_policy: current_month
    required_attribution_mode: salesperson_allocation
    answer_note: 分摊净出库为拆分毛出库减退货事实金额；退货按退货事实业务员100%归属，排除内部客户。
  allocated_net_receipt_amount:
    disclosures:
      - id: target.allocated_net_receipt_amount.legacy-note
        mode: contract_only
        text: "分摊净收款为收款拆分金额减退款拆分金额，包含内部客户。"
    availability: *allocation_pending_reconciliation
    label: 业务员分摊口径净收款金额
    business_definition: 所选期间按业务员分摊归属统计的净收款人民币实际金额；收款目标与实际均包含内部客户。
    unit: 人民币元
    query_kind: allocated_amount
    max_group_dimensions: 2
    source_completion_metric: receipt_target_completion
    source_path: salesperson_allocation
    time_policy: current_month
    required_attribution_mode: salesperson_allocation
    answer_note: 分摊净收款为收款拆分金额减退款拆分金额，包含内部客户。
  delivery_target_completion:
    disclosures:
      - id: target.delivery-completion.period-scope
        mode: required_always
        text: "目标和实际均排除内部客户；本月使用完整月目标与截至当前实际。"
      - id: target.delivery_target_completion.legacy-note
        mode: contract_only
        text: "实际值为净出库。salesperson_allocation 使用拆分毛出库并按退货事实业务员直接扣减；transaction_detail 使用非拆分出库与退货事实。目标和实际均排除内部客户；本月使用完整月目标与截至当前实际；目标为零、无目标、目标不完整和未来期间均由结构化状态区分。"
    label: 出库目标完成情况
    business_definition: 对照所选期间同一归属口径下的出库目标与净出库实际，返回目标、实际、缺口、完成率及目标和期间状态；目标与实际均排除内部客户。
    unit_policy: 目标、实际与缺口为人民币元；完成率为比例（可为负，可超过1，不做截断）
    query_kind: target_completion
    max_group_dimensions: 2
    time_policy: current_month
    allowed_attribution_modes: [transaction_detail, salesperson_allocation]
    answer_note: 实际值为净出库。salesperson_allocation 使用拆分毛出库并按退货事实业务员直接扣减；transaction_detail 使用非拆分出库与退货事实。目标和实际均排除内部客户；本月使用完整月目标与截至当前实际；目标为零、无目标、目标不完整和未来期间均由结构化状态区分。
    paths:
      salesperson_allocation:
        availability: *allocation_pending_reconciliation
        allowed_dimensions: [salesperson, department, organization]
        ledger: salesperson_allocation
        target: {table: vk_dwd.delivery_target_split_dwd, measure: detail_target_rmb, time_field: year_month, time_granularity: month, required_filters: {is_inner_cus: {op: eq, value: n}}}
        actual:
          components:
            - table: vk_dwd.sale_bill_split_dwd
              measure: delivery_amount_rmb
              sign: 1
              time_field: delivery_time
              required_filters: {bill_status: {op: eq, value: 6}, is_inner_cus: {op: eq, value: n}}
              dimension_mappings:
                salesperson: {key: sales_id, outputs: [{column: sales_name, alias: sales_name}], filter: sales_name}
                department: {key: customer_dept, outputs: [{column: customer_dept, alias: customer_dept}], filter: customer_dept}
                organization: {key: org_name, outputs: [{column: org_name, alias: org_name}], filter: org_name}
            - table: vk_dwd.delivery_return_detail_dwd
              measure: return_amount_rmb
              sign: -1
              time_field: statement_time
              required_filters: {status: {op: eq, value: 4}, complnt_type: {op: eq, value: 1}, channel_type: {op: eq, value: 1}, is_inner_cus: {op: eq, value: n}}
              dimension_mappings:
                salesperson: {key: sales_id, outputs: [{column: sales_name, alias: sales_name}], filter: sales_name}
                department: {key: customer_dept, outputs: [{column: customer_dept, alias: customer_dept}], filter: customer_dept}
                organization: {key: biz_org, outputs: [{column: biz_org, alias: org_name}], filter: biz_org}
        dimension_mappings:
          salesperson: {target_key: sales_id, target_outputs: [{column: sales_name, alias: sales_name}], target_filter: sales_name, actual_key: sales_id, actual_outputs: [{column: sales_name, alias: sales_name}], actual_filter: sales_name}
          department: {target_key: customer_dept, target_outputs: [{column: customer_dept, alias: customer_dept}], target_filter: customer_dept, actual_key: customer_dept, actual_outputs: [{column: customer_dept, alias: customer_dept}], actual_filter: customer_dept}
          organization: {target_key: org_name, target_outputs: [{column: org_name, alias: org_name}], target_filter: org_name, actual_key: org_name, actual_outputs: [{column: org_name, alias: org_name}], actual_filter: org_name}
      transaction_detail:
        allowed_dimensions: [customer, department, organization]
        ledger: transaction_detail
        target: {table: vk_dwd.delivery_target_detail_dwd, measure: detail_target_rmb, time_field: year_month, time_granularity: month, required_filters: {is_inner_cus: {op: eq, value: n}}}
        actual:
          components:
            - table: vk_dwd.sale_bill_goods_detail_dwd
              measure: delivery_amount_rmb
              sign: 1
              time_field: delivery_time
              required_filters: {bill_status: {op: eq, value: 6}, is_inner_cus: {op: eq, value: n}}
              dimension_mappings:
                customer: {key: customer_id, outputs: [{column: customer_name, alias: customer_name}], filter: customer_name}
                department: {key: customer_dept, outputs: [{column: customer_dept, alias: customer_dept}], filter: customer_dept}
                organization: {key: org_name, outputs: [{column: org_name, alias: org_name}], filter: org_name}
            - table: vk_dwd.delivery_return_detail_dwd
              measure: return_amount_rmb
              sign: -1
              time_field: statement_time
              required_filters: {status: {op: eq, value: 4}, complnt_type: {op: eq, value: 1}, channel_type: {op: eq, value: 1}, is_inner_cus: {op: eq, value: n}}
              dimension_mappings:
                customer: {key: customer_id, outputs: [{column: customer_name, alias: customer_name}], filter: customer_name}
                department: {key: customer_dept, outputs: [{column: customer_dept, alias: customer_dept}], filter: customer_dept}
                organization: {key: biz_org, outputs: [{column: biz_org, alias: org_name}], filter: biz_org}
        dimension_mappings:
          customer: {target_key: customer_id, target_outputs: [{column: customer_name, alias: customer_name}], target_filter: customer_name, actual_key: customer_id, actual_outputs: [{column: customer_name, alias: customer_name}], actual_filter: customer_name}
          department: {target_key: customer_dept, target_outputs: [{column: customer_dept, alias: customer_dept}], target_filter: customer_dept, actual_key: customer_dept, actual_outputs: [{column: customer_dept, alias: customer_dept}], actual_filter: customer_dept}
          organization: {target_key: org_name, target_outputs: [{column: org_name, alias: org_name}], target_filter: org_name, actual_key: org_name, actual_outputs: [{column: org_name, alias: org_name}], actual_filter: org_name}
  receipt_target_completion:
    disclosures:
      - id: target.receipt-completion.period-scope
        mode: required_always
        text: "目标和实际均包含内部客户；本月使用完整月目标与截至当前实际。"
      - id: target.receipt_target_completion.legacy-note
        mode: contract_only
        text: "实际值为净收款，即收款人民币减退款人民币。salesperson_allocation 使用收款拆分事实减退款拆分事实；transaction_detail 使用收款明细事实减退款明细事实。目标和实际均包含内部客户，部门统一按 customer_dept；本月使用完整月目标与截至当前实际；目标为零、无目标、目标不完整和未来期间均由结构化状态区分。"
    label: 收款目标完成情况
    business_definition: 对照所选期间同一归属口径下的收款目标与净收款实际，返回目标、实际、缺口、完成率及目标和期间状态；目标与实际均包含内部客户。
    unit_policy: 目标、实际与缺口为人民币元；完成率为比例（可为负，可超过1，不做截断）
    query_kind: target_completion
    max_group_dimensions: 2
    time_policy: current_month
    allowed_attribution_modes: [transaction_detail, salesperson_allocation]
    answer_note: 实际值为净收款，即收款人民币减退款人民币。salesperson_allocation 使用收款拆分事实减退款拆分事实；transaction_detail 使用收款明细事实减退款明细事实。目标和实际均包含内部客户，部门统一按 customer_dept；本月使用完整月目标与截至当前实际；目标为零、无目标、目标不完整和未来期间均由结构化状态区分。
    paths:
      salesperson_allocation:
        availability: *allocation_pending_reconciliation
        allowed_dimensions: [salesperson, department, organization]
        ledger: salesperson_allocation
        target: {table: vk_dwd.receive_target_split_dwd, measure: plan_receive_rmb, time_field: plan_receive_time, required_filters: {}}
        actual:
          components:
            - table: vk_dwd.receive_bill_split_dwd
              measure: detail_receive_rmb
              sign: 1
              time_field: bill_time
              required_filters: {bill_status: {op: ne, value: A}}
              dimension_mappings:
                salesperson: {key: sales_id, outputs: [{column: sales_name, alias: sales_name}], filter: sales_name}
                department: {key: customer_dept, outputs: [{column: customer_dept, alias: customer_dept}], filter: customer_dept}
                organization: {key: org_name, outputs: [{column: org_name, alias: org_name}], filter: org_name}
            - table: vk_dwd.receive_return_bill_split_dwd
              measure: detail_return_rmb
              sign: -1
              time_field: bill_time
              required_filters: {bill_status: {op: ne, value: A}}
              dimension_mappings:
                salesperson: {key: sales_id, outputs: [{column: sales_name, alias: sales_name}], filter: sales_name}
                department: {key: customer_dept, outputs: [{column: customer_dept, alias: customer_dept}], filter: customer_dept}
                organization: {key: org_name, outputs: [{column: org_name, alias: org_name}], filter: org_name}
        dimension_mappings:
          salesperson: {target_key: sales_id, target_outputs: [{column: sales_name, alias: sales_name}], target_filter: sales_name, actual_key: sales_id, actual_outputs: [{column: sales_name, alias: sales_name}], actual_filter: sales_name}
          department: {target_key: customer_dept, target_outputs: [{column: customer_dept, alias: customer_dept}], target_filter: customer_dept, actual_key: customer_dept, actual_outputs: [{column: customer_dept, alias: customer_dept}], actual_filter: customer_dept}
          organization: {target_key: org_name, target_outputs: [{column: org_name, alias: org_name}], target_filter: org_name, actual_key: org_name, actual_outputs: [{column: org_name, alias: org_name}], actual_filter: org_name}
      transaction_detail:
        allowed_dimensions: [customer, department, organization]
        ledger: transaction_detail
        target: {table: vk_dwd.receive_target_dwd, measure: plan_receive_rmb, time_field: plan_receive_time, required_filters: {}}
        actual:
          components:
            - table: vk_dwd.receive_bill_detail_dwd
              measure: detail_receive_rmb
              sign: 1
              time_field: bill_time
              required_filters: {bill_status: {op: ne, value: A}}
              dimension_mappings:
                customer: {key: customer_id, outputs: [{column: customer_name, alias: customer_name}], filter: customer_name}
                department: {key: customer_dept, outputs: [{column: customer_dept, alias: customer_dept}], filter: customer_dept}
                organization: {key: org_name, outputs: [{column: org_name, alias: org_name}], filter: org_name}
            - table: vk_dwd.receive_return_bill_detail_dwd
              measure: detail_return_rmb
              sign: -1
              time_field: bill_time
              required_filters: {bill_status: {op: ne, value: A}}
              dimension_mappings:
                customer: {key: customer_id, outputs: [{column: customer_name, alias: customer_name}], filter: customer_name}
                department: {key: customer_dept, outputs: [{column: customer_dept, alias: customer_dept}], filter: customer_dept}
                organization: {key: org_name, outputs: [{column: org_name, alias: org_name}], filter: org_name}
        dimension_mappings:
          customer: {target_key: customer_id, target_outputs: [{column: customer_name, alias: customer_name}], target_filter: customer_name, actual_key: customer_id, actual_outputs: [{column: customer_name, alias: customer_name}], actual_filter: customer_name}
          department: {target_key: customer_dept, target_outputs: [{column: customer_dept, alias: customer_dept}], target_filter: customer_dept, actual_key: customer_dept, actual_outputs: [{column: customer_dept, alias: customer_dept}], actual_filter: customer_dept}
          organization: {target_key: org_name, target_outputs: [{column: org_name, alias: org_name}], target_filter: org_name, actual_key: org_name, actual_outputs: [{column: org_name, alias: org_name}], actual_filter: org_name}
formula:
  completion_rate: actual_amount / target_amount
  gap: target_amount - actual_amount
  delivery_actual: gross_delivery_amount - return_amount
  receipt_actual: receipt_amount - refund_amount
