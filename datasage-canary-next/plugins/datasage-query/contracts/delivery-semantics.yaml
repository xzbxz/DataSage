      dimensions: [customer, salesperson, department, business_department, organization, product]
    dimension_overrides: *current_attribute_overrides
    answer_note: *answer_note_delivery_amount
    answer_contract:
      - "完整且已对账的变化分解支持结构贡献；这是净变化的结构分解，不代表业务原因或驱动。"
  delivery_amount_original:
    delivery_scope_policy: *delivery_scope_contract_2
    disclosures:
      - *disclosure_net_period_scope
      - *disclosure_net_current_master_reclassification
      - *disclosure_net_organization_equivalence
      - id: currency.original.no-cross-currency
        mode: required_always
        text: "原币金额必须限定单一币种或按币种分组，不同币种不得直接相加。"
      - id: delivery.delivery_amount_original.legacy-note
        mode: contract_only
        text: &answer_note_delivery_amount_original "只说原币时按币种分组，明确币种时限定该币种；不同原币不得相加，结果允许为负数。"
    label: 原币净出库金额
    business_definition: 所选期间同币种毛出库原币金额扣除同期有效退货原币金额后的净流量；必须按币种筛选或分组，不得跨币种相加。
    unit: 原币金额（按币种分别计量）
    formula: gross_delivery_amount_original - return_amount_original
    components:
      - {metric: gross_delivery_amount_original, sign: 1}
      - {metric: return_amount_original, sign: -1}
    time_policy: current_month
    allowed_dimensions: *net_delivery_derived_analysis
    dimension_overrides: *current_attribute_overrides
    currency_policy: {mode: original_currency, column: currency_no, require_filter_or_group: true, never_sum_mixed_currency: true}
    answer_note: *answer_note_delivery_amount_original
  delivery_quantity:
    delivery_scope_policy: *delivery_scope_contract_2
    disclosures:
      - *disclosure_net_period_scope
      - *disclosure_net_current_master_reclassification
      - *disclosure_net_organization_equivalence
      - *disclosure_quantity_unit_scope
      - id: delivery.net-flow.meaning
        mode: contract_only
        text: "该指标为当期流量净出库，即毛出库减退货；结果允许为负数。"
      - id: delivery.delivery_quantity.legacy-note
        mode: contract_only
        text: &answer_note_delivery_quantity "默认出库数量为当期流量净出库数量，结果允许为负数。"
    label: 净出库数量
    business_definition: 所选期间毛出库业务数量扣除同期有效退货业务数量后的净流量。
    unit_policy: *quantity_group_or_filter
    formula: gross_delivery_quantity - return_quantity
    components:
      - {metric: gross_delivery_quantity, sign: 1}
      - {metric: return_quantity, sign: -1}
    time_policy: current_month
    allowed_dimensions: *net_delivery_derived_analysis
    dimension_overrides: *current_attribute_overrides
    answer_note: *answer_note_delivery_quantity
  delivery_roll_count:
    delivery_scope_policy: *delivery_scope_contract_2
    disclosures:
      - *disclosure_net_period_scope
      - *disclosure_net_current_master_reclassification
      - *disclosure_net_organization_equivalence
      - id: delivery.net-flow.meaning
        mode: required_always
        text: "该指标为当期流量净出库，即毛出库减退货；结果允许为负数。"
      - id: delivery.delivery_roll_count.legacy-note
        mode: contract_only
        text: &answer_note_delivery_roll_count "默认出库卷数为当期流量净出库卷数，结果允许为负数。"
    label: 净出库卷数
    business_definition: 所选期间毛出库卷数扣除同期有效退货卷数后的净流量。
    unit: 卷
    formula: gross_delivery_roll_count - return_roll_count
    components:
      - {metric: gross_delivery_roll_count, sign: 1}
      - {metric: return_roll_count, sign: -1}
    time_policy: current_month
    allowed_dimensions: *net_delivery_derived_analysis
    dimension_overrides: *current_attribute_overrides
    answer_note: *answer_note_delivery_roll_count

  return_amount_rate:
    delivery_scope_policy: *delivery_scope_contract_2
    disclosures:
      - *disclosure_net_period_scope
      - *disclosure_net_current_master_reclassification
      - *disclosure_net_organization_equivalence
      - id: delivery.return-amount-rate.denominator
        mode: required_always
        text: "金额退货率以同期毛出库金额为分母；毛出库金额小于等于零时结果未定义，退货率允许超过100%。"
      - id: delivery.return_amount_rate.legacy-note
        mode: contract_only
        text: &answer_note_return_amount_rate "默认退货率为当期金额流量退货率；毛出库金额小于等于零时返回空值，退货率允许超过100%。"
    label: 当期金额退货率
    business_definition: 所选期间退货人民币金额相对于同期毛出库人民币金额的比例；基数不可用时结果未定义。
    unit: 比例（可大于1；展示为百分比时可超过100%）
    formula: return_amount / gross_delivery_amount
    ratio: {numerator: return_amount, denominator: gross_delivery_amount}
    time_policy: current_month
    allowed_dimensions: *net_delivery_derived_analysis
    dimension_overrides: *current_attribute_overrides
    answer_note: *answer_note_return_amount_rate
  return_quantity_rate:
    delivery_scope_policy: *delivery_scope_contract_2
    disclosures:
      - *disclosure_net_period_scope
      - *disclosure_net_current_master_reclassification
      - *disclosure_net_organization_equivalence
      - *disclosure_quantity_unit_scope
      - id: delivery.return-quantity-rate.denominator
        mode: contract_only
        text: "数量退货率仅用于明确的数量口径，并以同期毛出库数量为分母；毛出库数量小于等于零时结果未定义。"
      - id: delivery.return_quantity_rate.legacy-note
        mode: contract_only
        text: &answer_note_return_quantity_rate "仅在用户明确要求数量退货率时使用；毛出库数量小于等于零时返回空值。"
    label: 当期数量退货率
    business_definition: 所选期间退货业务数量相对于同期毛出库业务数量的比例；基数不可用时结果未定义。
    unit: 比例（可大于1；展示为百分比时可超过100%）
    unit_policy: *quantity_group_or_filter
    formula: return_quantity / gross_delivery_quantity
    ratio: {numerator: return_quantity, denominator: gross_delivery_quantity}
    time_policy: current_month
    allowed_dimensions: *net_delivery_derived_analysis
    dimension_overrides: *current_attribute_overrides
    answer_note: *answer_note_return_quantity_rate
  return_roll_rate:
    delivery_scope_policy: *delivery_scope_contract_2
    disclosures:
      - *disclosure_net_period_scope
      - *disclosure_net_current_master_reclassification
      - *disclosure_net_organization_equivalence
      - id: delivery.return-roll-rate.denominator
        mode: required_always
        text: "卷数退货率仅用于明确的卷数口径，并以同期毛出库卷数为分母；毛出库卷数小于等于零时结果未定义。"
      - id: delivery.return_roll_rate.legacy-note
        mode: contract_only
        text: &answer_note_return_roll_rate "仅在用户明确要求卷数退货率时使用；毛出库卷数小于等于零时返回空值。"
    label: 当期卷数退货率
    business_definition: 所选期间退货卷数相对于同期毛出库卷数的比例；基数不可用时结果未定义。
    unit: 比例（可大于1；展示为百分比时可超过100%）
    formula: return_roll_count / gross_delivery_roll_count
    ratio: {numerator: return_roll_count, denominator: gross_delivery_roll_count}
    time_policy: current_month
    allowed_dimensions: *net_delivery_derived_analysis
    dimension_overrides: *current_attribute_overrides
    answer_note: *answer_note_return_roll_rate

  delivery_order_count:
    delivery_scope_policy: &delivery_scope_contract_3 {allowed_scopes: [default_net, order_delivery_alignment], required: false, default: default_net}
    disclosures:
      - id: delivery.order-count.gross-scope
        mode: required_always
        text: "出库订单数是产生有效毛出库的非重复订单数；退货不会反向减少订单计数，也不构造净订单数。"
      - id: delivery.delivery_order_count.legacy-note
        mode: contract_only
        text: &answer_note_delivery_order_count "订单数是毛出库订单数，不能用退货单或来源单数相减生成净订单数。"
    label: 出库订单数
    business_definition: 所选出库期间内产生有效毛出库的非重复出库订单数量；退货不会反向减少订单计数。
    unit: 单
    table: vk_dwd.sale_bill_goods_detail_dwd
    aggregation: count_distinct
    measure: sale_bill_id
    time_field: delivery_time
    time_policy: current_month
    required_filters: *delivery_filters
    allowed_dimensions: *delivery_analysis
    answer_note: *answer_note_delivery_order_count
  order_amount:
    delivery_scope_policy: *delivery_scope_contract_3
    disclosures: []
    label: 下单金额
    business_definition: 所选下单期间内订单记录的人民币金额，按订单发生口径统计。
    unit: 人民币元
    table: vk_dwd.sale_bill_goods_detail_dwd
    aggregation: sum
    measure: sale_amount_rmb
    time_field: sale_time
    time_policy: current_month
    required_filters: &order_filters
      is_inner_cus: {op: eq, value: n}
    allowed_dimensions: *delivery_analysis
    change_decomposition:
      mode: additive_partition
      dimensions: [customer, salesperson, department, business_department, organization, product]
  order_amount_original:
    delivery_scope_policy: *delivery_scope_contract_2
    disclosures: []
    label: 原币下单金额
    business_definition: 所选下单期间内订单记录的原币金额；必须按币种筛选或分组，不得跨币种相加。
    unit: 原币金额（按币种分别计量）
    table: vk_dwd.sale_bill_goods_detail_dwd
    aggregation: sum
    measure: sale_amount
    time_field: sale_time
    time_policy: current_month
    required_filters: *order_filters
    allowed_dimensions: *delivery_analysis
    currency_policy: {mode: original_currency, column: currency_no, require_filter_or_group: true, never_sum_mixed_currency: true}
  order_quantity:
    delivery_scope_policy: *delivery_scope_contract_3
    disclosures:
      - *disclosure_quantity_unit_scope
    label: 下单数量
    business_definition: 所选下单期间内订单记录的业务数量。
    unit_policy: *quantity_group_or_filter
    table: vk_dwd.sale_bill_goods_detail_dwd
    aggregation: sum
    measure: sale_goods_num
    time_field: sale_time
    time_policy: current_month
    required_filters: *order_filters
    allowed_dimensions: *delivery_analysis
  order_roll_count:
    delivery_scope_policy: *delivery_scope_contract_3
    disclosures: []
    label: 下单卷数
    business_definition: 所选下单期间内订单记录的卷数。
    unit: 卷
    table: vk_dwd.sale_bill_goods_detail_dwd
    aggregation: sum
    measure: sale_piece_num
    time_field: sale_time
    time_policy: current_month
    required_filters: *order_filters
    allowed_dimensions: *delivery_analysis
  placed_order_count:
    delivery_scope_policy: *delivery_scope_contract_3
    disclosures: []
    label: 下单订单数
    business_definition: 所选下单期间内的非重复订单数量，按当前订单记录口径计数。
    unit: 单
    table: vk_dwd.sale_bill_goods_detail_dwd
    aggregation: count_distinct
    measure: sale_bill_id
    time_field: sale_time
    time_policy: current_month
    required_filters: *order_filters
    allowed_dimensions: *delivery_analysis

  fabric_delivery_source_summary:
    label: 面料源出库及低价标签摘要
    business_definition: 在独立出库源范围中返回已记录事件条数、卷数、人民币销售额、低价标签卷数和销售额、低价标签事件DDP与销售额差额，以及货源和形成依据覆盖。
    unit: 源出库事件条
    query_kind: fabric_source
    fabric_side: delivery
    table: vk_ads.delivery_barcode_source_ads
    source_key: barcode_detail_id
    source_fields:
    - goods_id
    - goods_name
    - goods_sku_id
    - piece_num
    - ddp_amount_rmb
    - source_channel
    - source_channel_set
    - source_channel_cnt
    - source_confidence
    - trace_confidence
    - source_ambiguity_flag
    - root_candidate_cnt
    - inventory_cohort
    - cohort_basis_time
    - cohort_basis_type
    - cohort_confidence
    - first_in_whse_time
    - first_in_whse_time_max
    - etl_time
    - barcode_detail_id
    - delivery_time
    - current_customer_dept
    - is_low_price
    - sale_amount_rmb
    - amount_exception_flag
    - is_inner_cus
    - is_ccbs_cus
    - bill_type
    time_policy: source_recorded_history
    max_group_dimensions: 4
    allowed_dimensions:
    - product
    - fabric_sku
    - department
    - fabric_channel
    - fabric_candidates
    - fabric_candidate_count
    - fabric_source_confidence
    - fabric_trace_confidence
    - fabric_ambiguity
    - fabric_root_count
    - fabric_cohort_label
    - fabric_formation
    - fabric_time_basis
    - fabric_ht
    dimension_overrides:
      product:
        label: 源产品
        columns:
        - goods_id
        - goods_name
        filter_column: goods_name
        value_contract:
          kind: entity_exact
        identity_filter:
          entity_type: product
          value_field: canonical_id
          column: goods_id
      department:
        label: 源出库客户部门
        columns:
        - current_customer_dept
        filter_column: current_customer_dept
        value_contract:
          kind: source_exact
          model_rule: 仅使用明确源值；显示标签不证明独立业务事实。
    result_fact_units:
      fabric_rolls: 卷
      fabric_known_rolls: 卷
      fabric_tagged_rolls: 卷
      fabric_known_tagged_rolls: 卷
      fabric_ddp_rmb: 人民币元
      fabric_known_ddp_rmb: 人民币元
      fabric_tagged_ddp_rmb: 人民币元
      fabric_known_tagged_ddp_rmb: 人民币元
      fabric_sales_rmb: 人民币元
      fabric_known_sales_rmb: 人民币元
      fabric_tagged_sales_rmb: 人民币元
      fabric_known_tagged_sales_rmb: 人民币元
      fabric_tagged_ddp_gap_rmb: 人民币元
      fabric_known_tagged_ddp_gap_rmb: 人民币元
      fabric_tag_rate: 比例
      fabric_tag_contribution: 比例
      fabric_scope_rows: 源记录条
      fabric_group_rows: 源记录条
      fabric_unknown_tags: 源记录条
      fabric_missing_rolls: 源记录条
      fabric_missing_ddp: 源记录条
      fabric_missing_sales: 源记录条
      fabric_negative_roll_rows: 源记录条
      fabric_identity_errors: 源记录条
      fabric_scope_unknown: 源记录条
      fabric_unknown_channels: 源记录条
      fabric_multiple_channels: 源记录条
      fabric_multiple_roots: 源记录条
      fabric_formation_pending: 源记录条
      fabric_missing_formation: 源记录条
      fabric_cross_year_roots: 源记录条
      fabric_low_formation_confidence: 源记录条
      fabric_missing_etl: 源记录条
      fabric_etl_time_count: 个
      fabric_population_groups: 个
      fabric_in_transit_rows: 源记录条
      fabric_current_status_unknown: 源记录条
      fabric_source_amount_exceptions: 源记录条
      fabric_scope_tagged_rolls: 卷
      metric_value: 源出库事件条
      fabric_unresolved_rolls_rows: 源记录条
      fabric_unresolved_tagged_rolls_rows: 源记录条
      fabric_unresolved_ddp_rmb_rows: 源记录条
      fabric_unresolved_tagged_ddp_rmb_rows: 源记录条
      fabric_unresolved_sales_rmb_rows: 源记录条
      fabric_unresolved_tagged_sales_rmb_rows: 源记录条
      fabric_unresolved_tagged_ddp_gap_rmb_rows: 源记录条
      fabric_no_source_rows: 源记录条
      fabric_unknown_candidates: 源记录条
      fabric_unknown_cohort_labels: 源记录条
    disclosures:
    - id: delivery.fabric-source.labels
      mode: required_always
      text: 源标签只作已记录事实，不把六成或八成升级为公司正式低价标准。DDP是源基准金额，不是已证明的财务成本；差额不是财务损失或利润。归一渠道不等于唯一真实来源；候选、低可信、无来源及未知保留。形成时间缺失、低可信兜底、跨年多根及根时间不完整进入待核验，源原标签另列；不独立证明血缘真实性。读取、业务发生和逐行ETL时点不同，最大ETL不能证明完整原子批次。
    - id: delivery.fabric-source.coverage
      mode: required_always
      text: 卷数是已记录事件累计或源快照卷数，不是唯一物理卷生命周期。两侧独立汇总，不按条码连接推导净销售或售罄率。原始数量、采购成本、正式重复退货率、人员或责任排名不开放。NULL不补零，已知部分与缺口分别返回，负数保留；存在缺卷数、未知标签或负卷数时完整标签比例受限。标签率分母是当前分组全部卷数；贡献份额分母是同一期间和筛选范围内全部分组的标签卷数（包含无来源和未知来源），在截断前计算，重复展示的总体不可相加。
    - id: delivery.fabric-source.scope
      mode: required_always
      text: 默认读取完整已记录出库ADS源范围，包含HT；源从2025年起，排内部客户和CCBS、按当前商品分类纳入面料，HT全类型、非HT大货。这不是全公司出库或默认净出库。HT按客户部门包含HT识别，不用此前基线净出库的后缀规则；可明确筛选非HT，部门缺失另列未知。显式期间按记录出库时间，时间缺失保留范围未知；不指定期间为全部已记录源历史。
    delivery_scope_policy:
      allowed_scopes:
      - source_recorded
      required: false
      default: source_recorded
