current_attribute_overrides: &current_attribute_overrides
  customer_label:
    label: 当前客户标签
    entity: customer
    source: {type: governed_join, dataset: vk_dwd.customer_dwd, local_column: customer_id, remote_column: customer_id, cardinality: many_to_one}
    columns: [{column: customer_label, alias: customer_label}]
    filter_column: customer_label
    answer_note: 退货事实缺少历史客户标签；净出库两侧统一按当前客户主数据标签归类。
  product_category:
    label: 当前产品分类
    entity: product
    source: {type: governed_join, dataset: vk_dwd.goods_detail_dwd, local_column: goods_id, remote_column: goods_id, cardinality: many_to_one}
    columns: [{column: category_name, alias: goods_category}]
    filter_column: category_name
    answer_note: 退货事实缺少历史产品分类；净出库两侧统一按当前产品主数据分类归类。
  ht_product:
    label: 当前HT产品
    entity: product
    source: {type: governed_join, dataset: vk_dwd.goods_detail_dwd, local_column: goods_id, remote_column: goods_id, cardinality: many_to_one}
    columns: [{column: is_ht, alias: is_ht}]
    filter_column: is_ht
    answer_note: 退货事实缺少历史产品HT属性；净出库两侧统一按当前产品主数据属性归类。

return_dimension_overrides: &return_dimension_overrides
  <<: *current_attribute_overrides
  organization:
    label: 业务组织
    entity: transaction_organization
    source: {type: fact}
    columns: [{column: biz_org, alias: org_name}]
    filter_column: biz_org
    answer_note: 退货使用自身事实的业务组织；业务 owner 已确认它与销售及物理出库组织为同一口径，可在各事实独立聚合后对齐。
    cross_fact_merge: owner_approved_equivalence
  bill_type:
    label: 单据类型
    entity: transaction_order
    source: {type: fact}
    columns: [{column: sale_bill_type, alias: bill_type}]
    filter_column: sale_bill_type
    answer_note: 退货单据类型直接使用退货事实 sale_bill_type，并统一输出为 bill_type；不回连原出库补充。

actual_return_warehouse_overrides: &actual_return_warehouse_overrides
  <<: *return_dimension_overrides
  warehouse:
    label: 实际退入仓
    entity: physical_warehouse
    source: {type: fact}
    columns:
      - {column: in_whse_id, alias: whse_id}
      - {column: whse_name, alias: whse_name}
    filter_column: whse_name
    identity_filter: {entity_type: warehouse, value_field: canonical_id, column: in_whse_id}
    answer_note: 退货按实际退入仓扣减，不追溯原出库仓。
  warehouse_region:
    label: 当前仓库区域
    entity: physical_warehouse
    source: {type: governed_join, dataset: vk_dwd.whse_info_dwd, local_column: in_whse_id, remote_column: whse_id, cardinality: many_to_one}
    columns: [{column: region, alias: whse_region}]
    filter_column: region
    answer_note: 退货事实没有仓库区域；按当前仓库主数据补充，并非退货时点历史快照。
  warehouse_department:
    label: 实际退入仓部门
    entity: physical_warehouse
    source: {type: fact}
    columns: [whse_dept]
    filter_column: whse_dept
    answer_note: 物理退货维度的部门固定使用实际退入仓记录的仓库部门，不使用客户部门或业务部门替代。
  warehouse_category:
    label: 实际退入仓分类
    entity: physical_warehouse
    source: {type: fact}
    columns: [whse_category]
    filter_column: whse_category
  missing_warehouse:
    label: 当前盘亏仓
    entity: physical_warehouse
    source: {type: governed_join, dataset: vk_dwd.whse_info_dwd, local_column: in_whse_id, remote_column: whse_id, cardinality: many_to_one}
    columns: [{column: is_missing, alias: is_missing}]
    filter_column: is_missing
    answer_note: 退货事实缺少盘亏仓标记；按当前仓库主数据补充，并非退货时点历史快照。
  defective_warehouse:
    label: 当前次品仓
    entity: physical_warehouse
    source: {type: governed_join, dataset: vk_dwd.whse_info_dwd, local_column: in_whse_id, remote_column: whse_id, cardinality: many_to_one}
    columns: [{column: is_defective, alias: is_defective_whse}]
    filter_column: is_defective
    answer_note: 退货事实缺少次品仓标记；按当前仓库主数据补充，并非退货时点历史快照。该字段是仓库属性，不等于商品次品项。
  ccbs_warehouse:
    label: 当前CCBS仓
    entity: physical_warehouse
    source: {type: governed_join, dataset: vk_dwd.whse_info_dwd, local_column: in_whse_id, remote_column: whse_id, cardinality: many_to_one}
    columns: [{column: is_ccbs, alias: is_ccbs_whse}]
    filter_column: is_ccbs
    answer_note: 退货事实缺少CCBS仓标记；按当前仓库主数据补充，并非退货时点历史快照。
  batch_no:
    label: 退货批次号
    entity: physical_piece
    source: {type: fact}
    columns: [batch_no]
    filter_column: batch_no
    answer_note: 净出库两侧分别按各自事实记录的批次号独立聚合后相减，不回连原出库补值。
  barcode:
    label: 退货条码
    entity: physical_piece
    source: {type: fact}
    columns: [bar_code]
    filter_column: bar_code
    answer_note: 净出库两侧分别按各自事实记录的条码独立聚合后相减，不使用来源单模糊回连。
  defective_item:
    label: 退货次品项
    entity: physical_piece
    source: {type: fact}
    columns: [is_defective]
    filter_column: is_defective
    answer_note: 商品或订单次品标志，不属于次品仓标志；净出库两侧分别按各自事实记录值聚合。

public_disclosures:
  net_period_scope: &disclosure_net_period_scope
    id: delivery.net-flow.period-scope
    mode: required_always
    text: 净出库按期间流量统计：毛出库按出库发生期间，退货按退货结算期间；两侧不按同一日期配对。
  net_current_master_reclassification: &disclosure_net_current_master_reclassification
    id: delivery.net-flow.current-master-reclassification
    mode: required_when
    when:
      any_request_dimension_or_filter_present: [customer_label, product_category, ht_product]
    text: 净出库的客户标签、产品分类和产品 HT 属性按当前主数据重新归类；主数据未匹配的记录保留为 unknown/null，不从分组或总体中丢弃；该归类不代表交易发生时的历史属性。
  return_current_master_reclassification: &disclosure_return_current_master_reclassification
    id: delivery.return.current-master-reclassification
    mode: required_when
    when:
      any_request_dimension_or_filter_present: [customer_label, product_category, ht_product]
    text: 退货的客户标签、产品分类和产品 HT 属性按当前主数据重新归类；主数据未匹配的记录保留为 unknown/null，不从分组或总体中丢弃；该归类不代表退货发生时的历史属性。
  return_completed_period: &disclosure_return_completed_period
    id: delivery.return.completed-settlement-period
    mode: required_always
    text: 退货指标仅统计有效且已完成的销售退货，并按退货结算期间统计。
  physical_actual_inbound: &disclosure_physical_actual_inbound
    id: delivery.physical.net.actual-inbound-warehouse
    mode: required_when
    when:
      any_request_dimension_or_filter_present: [warehouse, warehouse_region, warehouse_department, warehouse_category, missing_warehouse, defective_warehouse, ccbs_warehouse, batch_no, barcode, defective_item]
    text: 物理净出库毛出库按实际出库仓归属，退货按实际退入仓归属；仓库区域与仓库属性按各自事实或当前主数据归类。
  warehouse_delivery_amount_original_scope: &disclosure_warehouse_delivery_amount_original_scope
    id: delivery.warehouse-delivery-amount-original.net-scope
    mode: required_always
    text: 原币物理净出库按同币种毛出库金额扣除有效退货金额，退货按实际退入仓归属；不同币种不得相加，结果允许为负数。
  net_organization_equivalence: &disclosure_net_organization_equivalence
    id: delivery.net-organization.owner-confirmed-equivalence
    mode: required_when
    when: {any_request_dimension_or_filter_present: [organization]}
    text: 净出库及退货率按同一业务组织口径对齐；销售、物理出库和退货使用各自事实的组织值，退货侧已由业务 owner 确认等价，各事实先独立聚合再相减或计算比例。
  gross_organization_source: &disclosure_gross_organization_source
    id: delivery.gross-organization.fact-source
    mode: required_when
    when: {any_request_dimension_or_filter_present: [organization]}
    text: 毛出库指标按出库事实自身业务组织归属统计。
  return_organization_source: &disclosure_return_organization_source
    id: delivery.return-organization.fact-source
    mode: required_when
    when: {any_request_dimension_or_filter_present: [organization]}
    text: 退货指标按退货事实自身业务组织归属统计；该组织已由业务 owner 确认为与销售及物理出库组织同一口径。
  quantity_unit_scope: &disclosure_quantity_unit_scope
    id: delivery.quantity.unit-scope
    mode: required_always
    text: 数量按计量单位分别回答；m为米、y为码、kg为公斤、Pcs（含用户输入PCS）为件、m2/㎡为平方米；tao 只能按含义待确认的原始码报告，不同单位不得换算或合计。
  final_supplier_scope: &disclosure_final_supplier_scope
    id: delivery.physical.final-supplier
    mode: required_when
    when: {any_request_dimension_or_filter_present: [final_supplier]}
    text: 最终物理供应商仅用于物理毛出库；条码供应商存在时优先，否则使用产品供应商。退货不能稳定回连原条码，因此不用于物理净出库。

default_disclosures:
  - id: delivery.external-customer.scope
    mode: required_always
    text: "出库域的常规指标固定排除内部客户；源记录摘要仅以可确认外部客户记录计算已知数值，异常记录保留范围缺口。"
  - id: delivery.department.roles
    mode: required_when
    when: {any_request_dimension_or_filter_present: [department, business_department, business_region]}
    text: 用户只说部门时使用默认归属部门；业务发生部门和业务发生地区为独立交易归属，不能与默认部门互相替代。

metrics:
  warehouse_gross_delivery_amount:
    delivery_scope_policy: &delivery_scope_contract_1 {allowed_scopes: [explicit_gross, order_delivery_alignment], required: true, default: null}
    disclosures:
      - *disclosure_gross_organization_source
      - *disclosure_final_supplier_scope
      - id: delivery.warehouse-gross-delivery-amount.no-duplicate
        mode: required_always
        text: "真实物理维度毛出库金额使用出库记录自身金额，不与销售明细金额重复汇总。"
      - id: delivery.warehouse_gross_delivery_amount.legacy-note
        mode: contract_only
        text: &answer_note_warehouse_gross_delivery_amount "使用条码事实自身金额，禁止连接销售明细后重复汇总销售明细金额。"
    label: 真实物理维度毛出库金额
    business_definition: 按仓库、批次、条码等受控实物流转维度统计的毛出库人民币金额，尚未扣除退货。
    unit: 人民币元
    table: vk_dwd.delivery_bill_barcode_detail_dwd
    aggregation: sum
    measure: delivery_amount_rmb
    time_field: delivery_time
    time_policy: current_month
    required_filters: &barcode_delivery_filters
      is_inner_cus: {op: eq, value: n}
    metric_join: &barcode_sale_detail_metric_join
      dataset: vk_dwd.sale_bill_goods_detail_dwd
      local_columns: [sale_bill_goods_id]
      remote_columns: [goods_detail_id]
      cardinality: many_to_one
      required_filters:
        bill_status: {op: eq, value: 6}
    allowed_dimensions: *physical_delivery_analysis
    answer_note: *answer_note_warehouse_gross_delivery_amount
  warehouse_gross_delivery_quantity:
    delivery_scope_policy: *delivery_scope_contract_1
    disclosures:
      - *disclosure_gross_organization_source
      - *disclosure_final_supplier_scope
      - *disclosure_quantity_unit_scope
    label: 真实物理维度毛出库数量
    business_definition: 按仓库、批次、条码等受控实物流转维度统计的毛出库业务数量，尚未扣除退货。
    unit_policy: *quantity_group_or_filter
    table: vk_dwd.delivery_bill_barcode_detail_dwd
    aggregation: sum
    measure: goods_num
    time_field: delivery_time
    time_policy: current_month
    required_filters: *barcode_delivery_filters
