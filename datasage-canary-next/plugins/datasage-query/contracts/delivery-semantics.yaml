    - currency

value_contract_templates:
  entity_exact: &vc_entity_exact
    kind: entity_exact
    model_rule: 保留用户明确提供的精确实体 token；由工具做实体预检和稳定身份绑定，不得猜测。
  source_exact: &vc_source_exact
    kind: source_exact
    model_rule: 仅使用用户明确提供或受控结果返回的精确原值；不得猜测、翻译、归一化或扩展。
  boolean_yn: &vc_boolean_yn
    kind: closed
    allowed_values: [y, n]
    business_meanings: {y: 是, n: 否}

dimensions:
  customer:
    label: 客户
    entity: customer
    source: {type: fact}
    columns: [customer_id, customer_name]
    filter_column: customer_name
    identity_filter: {entity_type: customer, value_field: canonical_id, column: customer_id}
    value_contract: *vc_entity_exact
  salesperson:
    label: 业务员
    entity: transaction_salesperson
    source: {type: fact}
    columns: [sales_id, sales_name]
    filter_column: sales_name
    identity_filter: {entity_type: salesperson, value_field: canonical_id, column: sales_id}
    value_contract: *vc_entity_exact
    answer_note: 默认使用交易事实账；毛出库和退货分别采用各自事实的 sales_id。只有目标、协作或明确分摊问题才交给目标域的业务员分摊账。
    semantics: 使用销售或出库事实上的业务员，不使用客户当前负责人。
  department:
    label: 客户部门
    entity: customer_department
    source: {type: fact}
    columns: [customer_dept]
    filter_column: customer_dept
    value_contract: *vc_source_exact
  organization:
    label: 业务组织
    entity: transaction_organization
    source: {type: fact}
    columns: [org_name]
    filter_column: org_name
    value_contract: *vc_source_exact
  product:
    label: 产品
    entity: product
    source: {type: fact}
    columns: [goods_id, goods_name]
    filter_column: goods_name
    identity_filter: {entity_type: product, value_field: canonical_id, column: goods_id}
    value_contract: *vc_entity_exact
  color:
    label: 色号
    entity: product_color
    source: {type: fact}
    columns: [attr_val]
    filter_column: attr_val
    value_contract: *vc_source_exact
    lineage: 由 goods_sku_id 关联 vk_ods.goods_sku_ods.sku_id 得到。
  color_label:
    label: 色号标签
    entity: product_color
    source: {type: fact}
    columns: [color_label]
    filter_column: color_label
    value_contract: *vc_source_exact
    lineage: 由 goods_sku_id 关联 vk_ods.goods_sku_ods.sku_id 得到。
  customer_region:
    label: 客户区域
    entity: customer
    source: {type: fact}
    columns: [customer_region]
    filter_column: customer_region
    value_contract: *vc_source_exact
  customer_type:
    label: 客户类型
    entity: customer
    source: {type: fact}
    columns: [customer_type]
    filter_column: customer_type
    value_contract: *vc_source_exact
  customer_category:
    label: 客户分类
    entity: customer
    source: {type: fact}
    columns: [customer_category]
    filter_column: customer_category
    value_contract: *vc_source_exact
  customer_label:
    label: 客户标签
    entity: customer
    source: {type: fact}
    columns: [customer_label]
    filter_column: customer_label
    value_contract: *vc_source_exact
  ha_customer:
    label: HA客户
    entity: customer
    source: {type: fact}
    columns: [is_ha_cus]
    filter_column: is_ha_cus
    value_contract: *vc_boolean_yn
  vip_customer:
    label: VIP客户
    entity: customer
    source: {type: fact}
    columns: [is_vip_cus]
    filter_column: is_vip_cus
    value_contract: *vc_boolean_yn
  ccbs_customer:
    label: CCBS客户
    entity: customer
    source: {type: fact}
    columns: [is_ccbs_cus]
    filter_column: is_ccbs_cus
    value_contract: *vc_boolean_yn
  ht_customer:
    label: HT客户
    entity: customer
    source: {type: fact}
    columns: [is_ht_cus]
    filter_column: is_ht_cus
    value_contract: *vc_boolean_yn
  brand_customer:
    label: 品牌客户
    entity: customer
    source: {type: fact}
    columns: [is_brand_cus]
    filter_column: is_brand_cus
    value_contract: *vc_boolean_yn
  product_region:
    label: 产品区域
    entity: product
    source: {type: fact}
    columns: [goods_region]
    filter_column: goods_region
    value_contract: *vc_source_exact
  product_category:
    label: 产品分类
    entity: product
    source: {type: fact}
    columns: [goods_category]
    filter_column: goods_category
    value_contract: *vc_source_exact
    lineage: 对应产品主数据的 category_name。
  printed_product:
    label: 印花产品
    entity: product
    source: {type: fact}
    columns: [is_print]
    filter_column: is_print
    value_contract: *vc_boolean_yn
  ht_product:
    label: HT产品
    entity: product
    source: {type: fact}
    columns: [is_ht]
    filter_column: is_ht
    value_contract: *vc_boolean_yn
  ready_goods:
    label: 备货产品
    entity: ready_goods
    source: {type: fact}
    columns: [is_ready]
    filter_column: is_ready
    value_contract: *vc_boolean_yn
    semantics: is_ready='y' 默认同时包含备货和试备货；回答必须说明该范围。
  customized_order:
    label: 中国订单或定制订单
    entity: transaction_order
    source: {type: fact}
    columns: [is_customized]
    filter_column: is_customized
    value_contract: *vc_boolean_yn
    semantics: 这是订单事实属性，不等于产品主数据中的“产品是否需要定做”。
  bill_type:
    label: 单据类型
    entity: transaction_order
    source: {type: fact}
    columns: [bill_type]
    filter_column: bill_type
    value_contract: *vc_source_exact
  supplier:
    label: 供应商
    entity: supplier
    source: {type: fact}
    columns: [supplier_id, supplier_no, supplier_name]
    filter_column: supplier_name
    identity_filter: {entity_type: supplier, value_field: canonical_id, column: supplier_id}
    value_contract: *vc_entity_exact

  currency:
    label: 币种
    entity: currency
    source: {type: fact}
    columns: [currency_no]
    filter_column: currency_no
    value_contract: *vc_source_exact
    answer_note: 人民币指标可跨来源币种汇总；只说原币时按币种分组，明确币种时限定该币种，不得把不同原币相加。

  warehouse:
    label: 仓库
    entity: physical_warehouse
    source: {type: barcode_fact}
    columns: [whse_id, whse_name]
    filter_column: whse_name
    identity_filter: {entity_type: warehouse, value_field: canonical_id, column: whse_id}
    value_contract: *vc_entity_exact
    answer_note: 仓库毛出库使用条码事实实际出库仓；默认仓库净出库按方案A用实际退入仓扣减退货。
  warehouse_region:
    label: 仓库区域
    entity: physical_warehouse
    source: {type: barcode_fact}
    columns: [whse_region]
    filter_column: whse_region
    value_contract: *vc_source_exact
  warehouse_department:
    label: 仓库部门
    entity: physical_warehouse
    source: {type: barcode_fact}
    columns: [whse_dept]
    filter_column: whse_dept
    value_contract: *vc_source_exact
    semantics: 仓库部门，不是客户部门 customer_dept。
  warehouse_category:
    label: 仓库分类
    entity: physical_warehouse
    source: {type: barcode_fact}
    columns: [whse_category]
    filter_column: whse_category
    value_contract: *vc_source_exact
  batch_no:
    label: 批次号
    entity: physical_piece
    source: {type: barcode_fact}
    columns: [batch_no]
    filter_column: batch_no
    value_contract: *vc_source_exact
  barcode:
    label: 条码
    entity: physical_piece
    source: {type: barcode_fact}
    columns: [bar_code]
    filter_column: bar_code
    value_contract: *vc_source_exact
  source_barcode:
    label: 原条码
    entity: physical_piece
    source: {type: barcode_fact}
    columns: [resource_barcode]
    filter_column: resource_barcode
    value_contract: *vc_source_exact
  cylinder_no:
    label: 缸号
    entity: physical_piece
    source: {type: barcode_fact}
    columns: [cylinder_no]
    filter_column: cylinder_no
    value_contract: *vc_source_exact
  missing_warehouse:
    label: 盘亏仓
    entity: physical_warehouse
    source: {type: barcode_fact}
    columns: [is_missing]
    filter_column: is_missing
    value_contract: *vc_boolean_yn
  defective_warehouse:
    label: 次品仓
    entity: physical_warehouse
    source: {type: barcode_fact}
    columns: [is_defective_whse]
    filter_column: is_defective_whse
    value_contract: *vc_boolean_yn
  defective_item:
    label: 次品项
    entity: physical_piece
    source: {type: barcode_fact}
    columns: [is_defective]
    filter_column: is_defective
    value_contract: *vc_boolean_yn
  ccbs_warehouse:
    label: CCBS仓
    entity: physical_warehouse
    source: {type: barcode_fact}
    columns: [is_ccbs_whse]
    filter_column: is_ccbs_whse
    value_contract: *vc_boolean_yn

  customer_grade:
    label: 当前客户等级
    entity: customer
    source: &customer_join {type: governed_join, dataset: vk_dwd.customer_dwd, local_column: customer_id, remote_column: customer_id, cardinality: many_to_one}
    columns: [{column: customer_grade, alias: current_customer_grade}]
    filter_column: customer_grade
    value_contract: *vc_source_exact
    answer_note: 当前客户主数据属性，不是交易发生时的历史快照。
  customer_resource:
    label: 当前客户来源
    entity: customer
    source: *customer_join
    columns: [{column: customer_resource, alias: current_customer_resource}]
    filter_column: customer_resource
    value_contract: *vc_source_exact
    answer_note: 当前客户主数据属性，不是交易发生时的历史快照。
  customer_biz_label:
    label: 当前客户业务标签
    entity: customer
    source: *customer_join
    columns: [{column: biz_label, alias: current_customer_biz_label}]
    filter_column: biz_label
    value_contract: *vc_source_exact
    answer_note: 当前客户主数据属性，不是交易发生时的历史快照。
  customer_current_salesperson:
    label: 客户当前负责人
    entity: customer
    source: *customer_join
    columns:
      - {column: sales_id, alias: current_customer_sales_id}
      - {column: sales_name, alias: current_customer_sales_name}
    filter_column: sales_name
    value_contract: *vc_source_exact
    answer_note: 仅表示客户当前负责人，不替代事实表业务员归属。

  product_component:
    label: 当前产品成分
    entity: product
    source: &product_join {type: governed_join, dataset: vk_dwd.goods_detail_dwd, local_column: goods_id, remote_column: goods_id, cardinality: many_to_one}
    columns: [{column: component, alias: current_product_component}]
    filter_column: component
    value_contract: *vc_source_exact
    answer_note: 当前产品主数据属性，不是交易发生时的历史快照。
  product_technology:
    label: 当前产品工艺
    entity: product
    source: *product_join
    columns: [{column: technology, alias: current_product_technology}]
    filter_column: technology
    value_contract: *vc_source_exact
    answer_note: 当前产品主数据属性，不是交易发生时的历史快照。
  product_usage:
    label: 当前产品用途
    entity: product
    source: *product_join
    columns: [{column: usage, alias: current_product_usage}]
    filter_column: usage
    value_contract: *vc_source_exact
    answer_note: 当前产品主数据属性，不是交易发生时的历史快照。
  product_pattern:
    label: 当前产品花型
    entity: product
    source: *product_join
    columns: [{column: pattern, alias: current_product_pattern}]
    filter_column: pattern
    value_contract: *vc_source_exact
    answer_note: 当前产品主数据属性，不是交易发生时的历史快照。
  product_width:
    label: 当前产品幅宽
    entity: product
    source: *product_join
    columns: [{column: width, alias: current_product_width}]
    filter_column: width
    value_contract: *vc_source_exact
    answer_note: 当前产品主数据属性，不是交易发生时的历史快照。
  current_product_self_operated:
    label: 当前自营产品
    entity: product
    source: *product_join
    columns: [{column: is_self, alias: current_product_is_self}]
    filter_column: is_self
    value_contract: *vc_boolean_yn
    semantics: 仅使用产品主数据 is_self；事实表同名字段已废弃，禁止使用。
  current_product_made_to_order:
    label: 当前需要定做的产品
    entity: product
    source: *product_join
    columns: [{column: is_customized, alias: current_product_is_customized}]
    filter_column: is_customized
    value_contract: *vc_boolean_yn
    semantics: 仅表示产品当前是否需要定做，不等于事实表中的中国订单或定制订单属性。

  supplier_region:
    label: 当前供应商区域
