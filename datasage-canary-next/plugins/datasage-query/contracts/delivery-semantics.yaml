version: datasage-mini-delivery-semantics/v17
domain: delivery
contract_role: plugin_physical_execution
model_planner_contract: references/planner-contract.yaml
triggers: [出库, 净出库, 毛出库, 仓库出库, 条码出库, 退货, 退货率, 出货, 下单, 订单, 销量, 出库金额, 出库数量, 出库卷数, 原币, 客户排名, 产品排名, 色号, 供应商, 备货, 销售额, 销售金额]

tables:
  - vk_dwd.sale_bill_goods_detail_dwd
  - vk_dwd.delivery_bill_barcode_detail_dwd
  - vk_dwd.delivery_return_detail_dwd
  - vk_dwd.customer_dwd
  - vk_dwd.goods_detail_dwd
  - vk_ods.goods_sku_ods
  - vk_dwd.supplier_info_dwd
  - vk_dwd.whse_info_dwd
  - vk_ods.ready_goods_detail

fact:
  table: vk_dwd.sale_bill_goods_detail_dwd
  grain: 一行是一张销售或出库单中的一个商品色号明细
  primary_key: [goods_detail_id]
  updated_at: gmt_modified

barcode_fact:
  table: vk_dwd.delivery_bill_barcode_detail_dwd
  grain: 一行是一条真实出库的布匹条码明细
  primary_key: [barcode_detail_id]
  sales_detail_relation:
    local: sale_bill_goods_id
    remote_table: vk_dwd.sale_bill_goods_detail_dwd
    remote: goods_detail_id
    cardinality: many_to_one
  document_key: sale_bill_id
  time_field: delivery_time
  updated_at: gmt_modified
  usage: 仓库、条码、批次、缸号和单匹等真实物理维度；使用条码自身金额、数量和卷数，不把销售明细措施复制到条码粒度。

return_fact:
  table: vk_dwd.delivery_return_detail_dwd
  grain: 一行是一条实实在在退回的布匹条码明细
  primary_key: [barcode_detail_id]
  document_key: complnt_apply_id
  source_delivery_key: channel_id
  actual_inbound_warehouse: [in_whse_id, whse_name]
  time_field: statement_time
  updated_at: gmt_modified

defaults:
  time_policy: current_natural_month
  recent_without_unit: latest_30_natural_days
  currency: rmb
  original_currency_policy: bare_group_by_currency_or_explicit_currency_filter
  original_currency_resolution:
    bare_request: group_by_currency
    named_currency: filter_named_currency
    mixed_currency_total: forbidden
  exclude_internal_customer: true
  salesperson_ledger: transaction_detail
  intents:
    sales_volume:
      phrases: [销量]
      metrics: [delivery_amount, delivery_roll_count]
      scope: period_flow_net_delivery
      answer_note: 默认按当期流量净出库口径，同时返回净出库金额和净出库卷数，不附带订单数。
    order_count:
      phrases: [订单数, 单数]
      metric: delivery_order_count
      scope: delivery
      answer_note: 默认按出库订单数口径；用户明确说下单订单数时改用 placed_order_count。
    warehouse_delivery:
      phrases: [按仓库看出库, 仓库出库]
      metrics: [warehouse_delivery_amount, warehouse_delivery_roll_count]
      scope: actual_warehouse_period_flow_net_delivery
      attribution_mode: actual_outbound_minus_actual_return_inbound
      answer_note: 按实际出库仓统计毛出库，按实际退入仓扣减退货；必须说明退货按实际退入仓扣减。
    physical_net_delivery:
      phrases: [按批次看出库, 按条码看出库, 按次品项看出库]
      metrics: [warehouse_delivery_amount, warehouse_delivery_roll_count]
      dimensions: [batch_no, barcode, defective_item]
      scope: period_flow_net_delivery_by_each_fact_value
      answer_note: 未限定毛出库时继续采用期间净出库；毛出库与退货按各自事实记录的同一维度值独立聚合后相减。
    gross_only_physical_dimension:
      phrases: [按原条码看毛出库, 按缸号看毛出库]
      metrics: [warehouse_gross_delivery_amount, warehouse_gross_delivery_roll_count]
      dimensions: [source_barcode, cylinder_no]
      scope: physical_gross_delivery_only
      answer_note: 原条码和缸号只支持用户明确要求毛出库；未限定口径的出库请求不得静默返回毛值，必须说明净出库能力边界。

ledger_policy:
  default: transaction_detail
  transaction_detail:
    positive_fact: vk_dwd.sale_bill_goods_detail_dwd
    physical_positive_fact: vk_dwd.delivery_bill_barcode_detail_dwd
    negative_fact: vk_dwd.delivery_return_detail_dwd
    salesperson_rule: each_fact_uses_its_own_sales_id
    physical_fact_rule: physical_dimensions_use_barcode_fact_measures
  salesperson_allocation:
    handoff_domain: target
    triggers: [目标, 协作, 分摊, 分摊业绩]
    ordinary_queries_must_not_use: [vk_dwd.sale_bill_split_dwd]

analysis_defaults:
  overview_time: current_natural_month
  trend_without_time: latest_30_natural_days_by_day
  change_without_time:
    current: latest_30_natural_days
    comparison: preceding_30_natural_days
  ranking_limit: 10
  change_observation_limit: 10
  comparison_kind: previous_period
  disclosure: 回答必须说明工具返回的实际时间范围，以及与用户问题相关的出库或下单口径、仓库归因、原币分组和当前主数据补充，并披露固定排除内部客户。

execution_policy:
  business_summary_mode: metric_only
  dataset_mode:
    purpose: controlled_single_dataset_detail_only
    may_recalculate_business_metrics: false
    may_bypass_metric_contracts: false
    raw_sql_or_model_join: forbidden
    detail_scopes:
      delivery:
        time_field: delivery_time
        required_filters:
          bill_status: {op: eq, value: 6}
          is_inner_cus: {op: eq, value: n}
      order:
        time_field: sale_time
        required_filters:
          is_inner_cus: {op: eq, value: n}
        prohibited_status_inheritance: bill_status
      return:
        time_field: statement_time
        required_filters:
          status: {op: eq, value: 4}
          complnt_type: {op: eq, value: 1}
          channel_type: {op: eq, value: 1}
          is_inner_cus: {op: eq, value: n}
  time_range:
    require_resolved_start_and_end: true
    governed_by: common.query_policy.governed_metric_time_range
    retained_controls: [domain_default_time, timeout, row_cap, aggregation, database_safeguards]
  freshness:
    data_updated_at_user_facing: false
    data_updated_at_required_for_answer: false
    null_data_updated_at_blocks_query: false
    rule: 不主动解释表同步时间，也不根据空值推断数据过期。

