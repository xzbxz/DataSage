    - printed_product
    - ht_product
    - ready_goods
    - customized_order
    - bill_type
    - supplier
    - customer_grade
    - customer_resource
    - customer_biz_label
    - customer_current_salesperson
    - product_component
    - product_technology
    - product_usage
    - product_pattern
    - product_width
    - current_product_self_operated
    - current_product_made_to_order
    - supplier_region
    - supplier_type
    - supplier_level
    - supplier_full_name
    - supplier_main_products
    - currency

  net_delivery_analysis: &net_delivery_analysis
    - customer
    - salesperson
    - department
    - organization
    - product
    - color
    - color_label
    - customer_region
    - customer_type
    - customer_category
    - customer_label
    - ha_customer
    - vip_customer
    - ccbs_customer
    - ht_customer
    - brand_customer
    - product_region
    - product_category
    - printed_product
    - ht_product
    - ready_goods
    - customized_order
    - bill_type
    - supplier
    - customer_grade
    - customer_resource
    - customer_biz_label
    - customer_current_salesperson
    - product_component
    - product_technology
    - product_usage
    - product_pattern
    - product_width
    - current_product_self_operated
    - current_product_made_to_order
    - supplier_region
    - supplier_type
    - supplier_level
    - supplier_full_name
    - supplier_main_products
