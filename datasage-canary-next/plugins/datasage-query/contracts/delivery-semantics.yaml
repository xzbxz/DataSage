    change_decomposition:
      mode: additive_partition
      dimensions: [customer, salesperson, department, organization, product]
    reasoning_topics: [customer_mix, demand_timing, external_event, product_mix]
  order_amount_original:
    disclosures: []
    label: 原币下单金额
    business_definition: 所选下单期间内订单记录的原币金额；必须按币种筛选或分组，不得跨币种相加。
    unit: 原币金额（按币种分别计量）
    table: vk_dwd.sale_bill_goods_detail_dwd
    aggregation: sum
    measure: sale_amount
    time_field: sale_time
    time_policy: current_month
    required_filters: *order_filters
    allowed_dimensions: *delivery_analysis
    currency_policy: {mode: original_currency, column: currency_no, require_filter_or_group: true, never_sum_mixed_currency: true}
  order_quantity:
    disclosures: []
    availability: *quantity_pending_unit_reconciliation
    label: 下单数量
    business_definition: 所选下单期间内订单记录的业务数量。
    unit_policy: 来源业务数量单位；不同计量单位不得换算或合并解释
    table: vk_dwd.sale_bill_goods_detail_dwd
    aggregation: sum
    measure: sale_goods_num
    time_field: sale_time
    time_policy: current_month
    required_filters: *order_filters
    allowed_dimensions: *delivery_analysis
  order_roll_count:
    disclosures: []
    label: 下单卷数
    business_definition: 所选下单期间内订单记录的卷数。
    unit: 卷
    table: vk_dwd.sale_bill_goods_detail_dwd
    aggregation: sum
    measure: sale_piece_num
    time_field: sale_time
    time_policy: current_month
    required_filters: *order_filters
    allowed_dimensions: *delivery_analysis
  placed_order_count:
    disclosures: []
    label: 下单订单数
    business_definition: 所选下单期间内的非重复订单数量，按当前订单记录口径计数。
    unit: 单
    table: vk_dwd.sale_bill_goods_detail_dwd
    aggregation: count_distinct
    measure: sale_bill_id
    time_field: sale_time
    time_policy: current_month
    required_filters: *order_filters
    allowed_dimensions: *delivery_analysis
