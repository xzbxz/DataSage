version: datasage-pattern-matching-semantics/v1
domain: pattern_matching
contract_role: plugin_physical_execution
business_name: 找版任务与关联出库证据
tables:
- vk_dwd.pattern_matching_dwd
- vk_dwd.sale_bill_goods_detail_dwd
dimensions:
  task:
    label: 找版任务编号
    columns:
    - task_id
    - column: task_no
      alias: task_number
    filter_column: task_no
    value_contract: &id002
      kind: source_exact
      model_rule: 仅使用用户明确提供或受控结果返回的精确原值，不拆分、猜测或扩展。
  customer:
    label: 任务客户
    columns:
    - customer_id
    - customer_name
    filter_column: customer_name
    value_contract: &id001
      kind: entity_exact
      model_rule: 使用现有实体解析及稳定身份绑定；同名歧义不可猜测。
    identity_filter:
      entity_type: customer
      value_field: canonical_id
      column: customer_id
  salesperson:
    label: 任务销售
    columns:
    - sales_id
    - sales_name
    filter_column: sales_name
    value_contract: *id001
    identity_filter:
      entity_type: salesperson
      value_field: canonical_id
      column: sales_id
  executor:
    label: 执行人
    columns:
    - executor_id
    - executor_erp_id
    - executor_name
    filter_column: executor_name
    value_contract: *id001
    identity_filter:
      entity_type: salesperson
      value_field: canonical_id
      column: executor_erp_id
  candidate_product:
    label: 最终候选产品编号
    columns:
    - column: final_goods_no
      alias: candidate_product_label
    filter_column: final_goods_no
    value_contract: *id002
  task_region:
    label: 任务原始区域
    columns:
    - task_region
    filter_column: task_region
    value_contract: *id002
  task_type:
    label: 任务类型
    columns:
    - task_type
    filter_column: task_type
    value_contract: *id002
  task_status:
    label: 记录任务状态
    columns:
    - column: task_status
      alias: task_status_label
    filter_column: task_status
    value_contract: *id002
  execute_status:
    label: 记录执行状态
    columns:
    - column: execute_status
      alias: execute_status_label
    filter_column: execute_status
    value_contract: *id002
  currency:
    label: 已核验出库币种
    columns:
    - currency_no
    filter_column: currency_no
    value_contract: *id002
metrics:
  task_recorded_summary:
    label: 找版·任务执行与关联证据
    business_definition: 当前记录任务数为主值，同时提供执行次数、执行人数、候选产品、存在找到/反馈/米样/关联记录的任务数及覆盖缺口。
    unit: 任务及独立证据计数
    query_kind: pattern_matching
    pattern_view: summary
    table: vk_dwd.pattern_matching_dwd
    linked_table: vk_dwd.sale_bill_goods_detail_dwd
    time_policy: current_snapshot
    max_group_dimensions: 4
    allowed_dimensions:
    - task
    - customer
    - salesperson
    - executor
    - candidate_product
    - task_region
    - task_type
    - task_status
    - execute_status
    allowed_time_bases:
    - current_observation
    - task_created
    - execution_completed
    disclosures: &id003
    - id: pattern.basis
      mode: required_always
      text: &pattern_basis 当前找版关联记录证据，一行不等于任务、执行、执行人或出库单；状态与找到、反馈、米样、关联出库是不同事实，不构造互斥漏斗或因果收入。
    - id: pattern.grain
      mode: required_always
      text: 任务和执行记录分别按可靠身份去重，执行记录不是执行人。存在肯定、否定、未填记录的任务数可重叠；完结不等于找到或成交。状态冲突和未定义值单列，不取任意记录当最终状态。分组去重数不能跨客户、执行人、产品或期间直接相加；未知身份及非单一产品串保留缺口。
    - id: pattern.time
      mode: required_always
      text: 默认当前全范围观察；指定期间须明确任务创建、执行完成或已关联出库实际发生口径。创建月队列看到的是本次读取时的已关联状态，可能后续补录、观察时长不同，不是历史当时快照或当月销售流水。读取时刻和业务修改最大时间分别返回，业务修改不证明ETL刷新，当前ETL频率未确认。
    - id: pattern.amount
      mode: required_always
      text: 已关联出库金额按稳定出库明细身份去重，不按金额值或单号去重；原币来自唯一匹配且校验通过的真实出库明细，不用需求币种或自行汇率换算。金额、身份、币种或关联条件冲突时保留已知部分与缺口。同一明细在不同任务或执行人组内可重复出现，分组合计不等于全范围明细去重总额；币种总体在截断前保留，不能重复累加。
    - id: pattern.attribution
      mode: required_always
      text: 归因记录金额按用户确认的任务、执行人、单一最终产品及出库明细去重；同人多次执行不重复算同一明细，跨任务或不同执行人仍可重复归因。它是关联记录归因合计，不是业绩功劳、增量收入或找版导致出库的证明。仅返回部分行不能视为全部结果。
    answer_note: *pattern_basis
  linked_delivery_amount:
    label: 找版·已关联出库明细去重金额
    business_definition: 按已关联出库明细稳定身份去重的原币金额；支持任务创建、执行完成、关联出库实际发生期间，金额冲突不任选记录。
    unit: 已核验交易原币（分别计量）
    query_kind: pattern_matching
    pattern_view: linked_amount
    table: vk_dwd.pattern_matching_dwd
    linked_table: vk_dwd.sale_bill_goods_detail_dwd
    time_policy: current_snapshot
    max_group_dimensions: 4
    allowed_dimensions:
    - task
    - customer
    - salesperson
    - executor
    - candidate_product
    - task_region
    - task_type
    - task_status
    - execute_status
    - currency
    allowed_time_bases:
    - current_observation
    - task_created
    - execution_completed
    - linked_delivery
    disclosures: *id003
    answer_note: *pattern_basis
  person_attributed_delivery_amount:
    label: 找版·按任务执行人产品归因记录金额
    business_definition: 按任务、执行人、单一最终产品和出库明细去重的关联记录原币金额；同一人重复执行不重复算同一明细。
    unit: 已核验交易原币（分别计量）
    query_kind: pattern_matching
    pattern_view: person_attributed_amount
    table: vk_dwd.pattern_matching_dwd
    linked_table: vk_dwd.sale_bill_goods_detail_dwd
    time_policy: current_snapshot
    max_group_dimensions: 4
    allowed_dimensions:
    - task
    - customer
    - salesperson
    - executor
    - candidate_product
    - task_region
    - task_type
    - task_status
    - execute_status
    - currency
    allowed_time_bases:
    - current_observation
    - task_created
    - execution_completed
    - linked_delivery
    disclosures: *id003
    answer_note: *pattern_basis
