        op: eq
        value: n
    allowed_dimensions:
    - product
    - pool_sku
    - warehouse_department
    - unit
    dimension_overrides:
      unit:
        label: 登记库存单位
        columns:
        - column: source_unit
          alias: unit
        filter_column: source_unit
        value_contract:
