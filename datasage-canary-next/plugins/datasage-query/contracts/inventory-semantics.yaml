    baseline_source_table: &slow_baseline_source_table vk_ods.slow_moving_goods_ods
    document_scope: legacy_ht_suffix_or_bulk
    flow_sources: &slow_baseline_flow_sources
      outbound: vk_dwd.delivery_bill_barcode_detail_dwd
      returns: vk_dwd.delivery_return_detail_dwd
      sales: vk_dwd.sale_bill_goods_detail_dwd
      warehouses: vk_dwd.whse_info_dwd
    disclosures:
    - id: inventory.frozen-net.basis
      mode: required_always
      text: &frozen_net_basis 只统计现存冻结基线产品、规格、仓库部门及可靠库存单位范围内的已记录流量，不把当前New补入基线；同产品新货也可能发生流转，不能称原冻结旧库存去化。
    - id: inventory.frozen-net.documents
      mode: required_always
      text: 沿用已确认旧追踪器范围：来源仓库部门以-HT结尾，或自身单据类型为大货；HT不另设类型白名单。出库与退货均用各自单据类型；大小写判断沿用来源规则，不修剪部门尾空格。出库须唯一关联已完成销售明细；退货须已结单销售退货并排除内部客户。未知类型单列，HT未知类型不因此排除。
    - id: inventory.frozen-net.attribution
      mode: required_always
      text: 毛出库按实际出库仓，退货按实际退入仓及各自事实部门，销售归属不回连原出库。销售按各自流水身份分组，未知身份保留未知组；不连接员工名册补零，不把基线池分配给销售。仓库主数据只核对当前部门一致性，不能替换事实历史归属；不一致或缺失保留未知覆盖。两侧独立汇总，再按唯一基线业务键相减。
    - id: inventory.frozen-net.coverage
      mode: required_always
      text: 所有数值仅描述已记录流量，不证明真实业务全量到齐。在合格基线、明确范围且没有未知候选时，没有匹配流水的空集合计零；单侧出库或退货正常计算代数差，负数保留。真实数量缺失或候选未知时主值留空、已知部分另列；空集合不计作缺失数量记录。缺失时间、身份、单位、有效性或归属时完整数值受限；候选、匹配、未匹配、排除和未知计数是筛选后基线产品/规格范围的全局记录数，不跨结果行重复相加。不同计量单位的数量不相加，不使用促销单位补缺；卷数与数量分开：卷数以卷为共同计量，可跨库存数量单位汇总，优先使用返回的对应范围卷数总量。
    - id: inventory.frozen-net.sales
      mode: required_always
      text: 销售只表示匹配流水归属，不代表滞销任务池责任。按稳定身份对齐，同名不同人分开；同一身份名称有差异时显示名称不确定及变体数，不以当前姓名覆盖历史。销售对应产品组可重叠，不能相加当唯一基线组数；此去重计数限制不代表按互斥流水身份分组的净卷数也重叠。单位总体流量、跨数量单位的卷数总量及销售卷数总量都在截断前计算；数量不跨单位合并。所有重复展示的总量不能再相加。显示组数，包含未知销售组；仅返回部分行不代表全体。指定销售筛选时未归属记录仍影响覆盖，不暗中分给该销售。
    - id: inventory.frozen-net.window
      mode: required_always
      text: 显式日期或月份必须选择单个现存基线周，期间起点不得早于实际冻结。未来未开始期间失败，未完期间截止本次读取并公开原请求结束；不把当下库存回填历史期末。一个月多周基线不相加，不自动生成月初池或精确完成率。该期间是选定基线产品范围的已记录流量，不能称当月新冻结任务总进度。
    - id: inventory.frozen-net.high-price
      mode: required_always
      text: 普通战果取净出库卷数；高折战果取成交价严格大于DDP的75%的出库卷数减全部合格退货卷数，恰好75%不计高折出库。不要求DDP正数；非正DDP或负成交价作为异常计数另列。价格或卷数缺失分开保留，高折缺口不抹掉完整普通净卷。高折筛选针对毛出库，两个净值是分别扣减退货后的代数差，不是两套明细集合；净值为零可能是无流水或正负抵消，须结合两侧卷数与覆盖判断。普通净卷为零不推出高折净卷为零；普通毛出库等于退货但高折毛出库少于退货时，高折净卷为负。零普通净值而高折非零的销售仍保留，负数和原精度不截断。两指标供进展观察，不生成奖金结算规则。
    - id: inventory.frozen-net.time
      mode: required_always
      text: 未指定期间时使用实际记录冻结时间（含）至本次库端读取时间（不含）；显式期间以返回的实际窗口为准。缺时间候选单独保留，不能证明发生在窗口内。时间保留库端原值，当前UTC偏移不证明历史时区。记录冻结时间可能更新，现存完整记录不证明原始冻结从未删改。没有基线或基线身份/单位不完整时明确失败，不写入或补建。
    answer_note: *frozen_net_basis

