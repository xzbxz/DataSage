    - id: inventory.fabric-source.coverage
      mode: required_always
      text: 卷数是已记录事件累计或源快照卷数，不是唯一物理卷生命周期。两侧独立汇总，不按条码连接推导净销售或售罄率。原始数量、采购成本、正式重复退货率、人员或责任排名不开放。NULL不补零，已知部分与缺口分别返回，负数保留；存在缺卷数、未知标签或负卷数时完整标签比例受限。标签率分母是当前分组全部卷数；贡献份额分母是同一期间和筛选范围内全部分组的标签卷数（包含无来源和未知来源），在截断前计算，重复展示的总体不可相加。
    - id: inventory.fabric-source.scope
      mode: required_always
      text: 默认完整源库存快照，包含在途，不代表公司全部库存；源有额外仓库组织、CCBS仓和商品分类排除。可显式选在仓范围，仅按主键唯一关联的读取时当前状态一或二筛选，未知状态保留范围缺口；不能把当前状态当ETL时历史状态。仓库部门使用源库存字段，不用出库客户部门或责任部门兜底。源标签不替换登记滞销池、DSO或库存周转口径，不回填历史库存。
