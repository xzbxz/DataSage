    label: 滞销独立月报·普通与高折净出库战果
    business_definition: 度量月初池业务键范围内所选自然月已记录的出退货净流量，分别返回净数量、普通净出库卷数和高折净出库卷数；这不是两端库存状态之差，New不纳入月初池战果。月初母集取上月物理快照，按旧范围四键汇总后数量大于10；当月期末取当前ODS源行门槛，历史期末取目标月物理快照，两端同步排除同次当前库存单位白名单组合。流水按双方实际时间和自身销售归属计算。
    query_kind: monthly_slow_pool
    table: vk_dw.inventory_barcode_detail_bymonth_dw
    time_policy: monthly_slow_pool
    max_group_dimensions: 5
    unit: 来源库存单位分别计量
    allowed_dimensions:
    - salesperson
    - product
    - pool_sku
    - warehouse_department
    - unit
    dimension_overrides:
      unit:
        label: 库存数量单位
        columns:
        - column: unit
          alias: unit
        filter_column: unit
        value_contract:
          kind: closed
          allowed_values:
          - m
          - y
          - kg
          - Pcs
          canonical_aliases:
            M: m
          business_meanings:
            m: 米
            y: 码
            kg: 千克
            Pcs: 件
        normalization: meter_case
    document_scope: legacy_ht_suffix_or_bulk
    flow_sources: *slow_baseline_flow_sources
    disclosures:
    - id: inventory.monthly-slow.basis
      mode: required_always
      text: 独立月报不是周基线月流水。月初为上月物理库存快照派生池；当月期末为本次当前登记池，历史期末为目标月物理快照。月两端按同一次当前白名单的产品、规格、仓库部门、库存单位组合排除，不使用促销单位。当前白名单重算历史范围是已确认政策，不要求新月初冻结。
    - id: inventory.monthly-slow.threshold
      mode: required_always
      text: 物理月快照排CCBS仓与指定两组织，按处理或可打折标签以及HCM、HN、BKK、IDK及各自后缀-HT部门范围纳入，四键汇总后数量大于10；当月当前ODS沿原源行数量大于10规则。不是10卷，不增加库存状态或销售单删除条件。人工只维护白名单，不重定库存数量和标签。
    - id: inventory.monthly-slow.coverage
      mode: required_always
      text: 月中新品参与总体变化但不进入月初池战果。当前月仅截至读取，期初与期末用同一份当前白名单，历史物理快照缺失不回填当前库存；期末缺失不抹掉可用期间战果。数量单位分别计量，缺值与来源未知单列，退出不等于售罄。白名单或池纳入依据未知时，已知部分仅反映可见候选，不能当完整已确认战果。月初业务组、来源行及规格标识计数含义不同；重复展示的总体和白名单覆盖计数不可再相加。
    - id: inventory.frozen-net.documents
      mode: required_always
      text: 沿用已确认旧追踪器范围：来源仓库部门以-HT结尾，或自身单据类型为大货；HT不另设类型白名单。出库与退货均用各自单据类型；大小写判断沿用来源规则，不修剪部门尾空格。出库须唯一关联已完成销售明细；退货须已结单销售退货并排除内部客户。未知类型单列，HT未知类型不因此排除。
    - id: inventory.frozen-net.attribution
      mode: required_always
      text: 毛出库按实际出库仓，退货按实际退入仓及各自事实部门，销售归属不回连原出库。销售按各自流水身份分组，未知身份保留未知组；不连接员工名册补零，不把基线池分配给销售。仓库主数据只核对当前部门一致性，不能替换事实历史归属；不一致或缺失保留未知覆盖。两侧独立汇总，再按唯一基线业务键相减。
    - id: inventory.frozen-net.coverage
      mode: required_always
      text: 所有数值仅描述已记录流量，不证明真实业务全量到齐。在合格基线、明确范围且没有未知候选时，没有匹配流水的空集合计零；单侧出库或退货正常计算代数差，负数保留。真实数量缺失或候选未知时主值留空、已知部分另列；空集合不计作缺失数量记录。缺失时间、身份、单位、有效性或归属时完整数值受限；候选、匹配、未匹配、排除和未知计数是筛选后基线产品/规格范围的全局记录数，不跨结果行重复相加。不同计量单位的数量不相加，不使用促销单位补缺；卷数与数量分开：卷数以卷为共同计量，可跨库存数量单位汇总，优先使用返回的对应范围卷数总量。
    - id: inventory.frozen-net.sales
      mode: required_always
      text: 销售只表示匹配流水归属，不代表滞销任务池责任。按稳定身份对齐，同名不同人分开；同一身份名称有差异时显示名称不确定及变体数，不以当前姓名覆盖历史。销售对应产品组可重叠，不能相加当唯一基线组数；此去重计数限制不代表按互斥流水身份分组的净卷数也重叠。单位总体流量、跨数量单位的卷数总量及销售卷数总量都在截断前计算；数量不跨单位合并。所有重复展示的总量不能再相加。显示组数，包含未知销售组；仅返回部分行不代表全体。指定销售筛选时未归属记录仍影响覆盖，不暗中分给该销售。
    - id: inventory.frozen-net.high-price
      mode: required_always
      text: 普通战果取净出库卷数；高折战果取成交价严格大于DDP的75%的出库卷数减全部合格退货卷数，恰好75%不计高折出库。不要求DDP正数；非正DDP或负成交价作为异常计数另列。价格或卷数缺失分开保留，高折缺口不抹掉完整普通净卷。高折筛选针对毛出库，两个净值是分别扣减退货后的代数差，不是两套明细集合；净值为零可能是无流水或正负抵消，须结合两侧卷数与覆盖判断。普通净卷为零不推出高折净卷为零；普通毛出库等于退货但高折毛出库少于退货时，高折净卷为负。零普通净值而高折非零的销售仍保留，负数和原精度不截断。两指标供进展观察，不生成奖金结算规则。
    monthly_view: flow
    monthly_snapshot_table: vk_dw.inventory_barcode_detail_bymonth_dw
    monthly_ods_table: vk_ods.slow_moving_goods_ods
    monthly_departments:
    - HCM
    - HN
    - BKK
    - IDK
    - HCM-HT
    - HN-HT
    - IDK-HT
    - BKK-HT

  registered_slow_historical_customers:
    dimension_overrides:
