    max_group_dimensions: &slow_pool_group_limit 3
    required_filters: &slow_pool_required_filters
      goods_num:
        op: gt
        value: 10
      is_whitelist:
        op: eq
        value: n
    allowed_dimensions: &slow_pool_allowed_dimensions
    - warehouse_department
    - product
    - pool_sku
    - color
    - pool_class
    - unit
    dimension_overrides:
      unit: &id003
        label: 登记库存单位
        columns:
        - column: source_unit
          alias: unit
        filter_column: source_unit
        value_contract:
          kind: closed
          allowed_values:
          - m
          - y
          - kg
          - Pcs
          canonical_aliases:
            M: m
          business_meanings:
            m: 米
            y: 码
            kg: 千克
            Pcs: 件
        normalization: meter_case
    classification_policy: &id004
      known_labels:
      - deprice
      - discountable
      - handing
      discountable_label: discountable
    disclosures: &slow_pool_disclosures
    - &id005
      id: inventory.registered-slow-pool.basis
      mode: required_always
      text: &id002 本次读取的当前登记滞销池，沿用旧追踪范围：排除白名单，仅统计各自库存单位下来源数量大于10的记录；不是10卷或统一10米，也不是按未销售天数重判全公司库存。读取日期不是库存刷新或人工维护时间；缺少筛选依据的记录不能证明已纳入。
    - &id006
      id: inventory.registered-slow-pool.classes
      mode: required_always
      text: 这里的可打折类别指优先分类结果，不等于原始可打折标签；原始标签与处理标签可重叠。登记类别与已记录正促销价可以重叠，不能相加当总池；交集单列。未记录价格不等于价格为零；未知登记分类单列，不能猜成其他类别。没有匹配记录不代表真实库存为零。
    - &id007
      id: inventory.registered-slow-pool.units
      mode: required_always
      text: 库存数量只按来源库存单位分别解释，不用促销计价单位补缺，不跨米、码、千克或件相加。未知库存单位的数量保留缺口，卷数取原记录且不取整。
    answer_note: *id002
    unit_policy:
      mode: group_or_filter
      column: source_unit
