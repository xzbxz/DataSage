default_disclosures:
- id: profit.scope
  mode: required_always
  text: 利润报表金额及毛利率公开分子分母均为人民币元，毛利率本身为比例；只代表已记录值，默认包含内部客户；显式筛选范围以结果为准。数据有更新不代表费用已归集或会计已结账，核算完成状态未确认。
- id: profit.missing-fees
  mode: required_always
  text: 费用空值保留为未知，不自动补零；有缺失时只能解释已知部分，不能据此声称完整费用总额或已对账。收入和毛利采用报表已存值，不用缺失费用重造最终利润。
metrics:
  customer_month_sales_revenue:
    label: 客户月度利润报表·销售收入（人民币）
    business_definition: 按报表归属月汇总客户全部属性组合行；同一客户同月可多行。无产品和订单字段，不能按产品/订单拆分客户月度利润。业务员归属缺失的记录保留未知，按业务员筛选只覆盖明确归属记录，不用现客户负责人补写。 销售收入取源报表已记录字段；不宣称已结账。
    unit: 人民币元
    table: vk_ads.customer_profit_ads
    aggregation: sum
    measure: sale_amount_rmb
    time_field: bill_date
    time_policy: current_month
    required_filters: {}
    allowed_dimensions: &id002
    - customer
    - department
    - organization
    - customer_category
    - bill_type
    - internal_customer
    - ccbs_customer
    - brand_customer
    - ha_customer
    - ht_customer
    - defective
    - ready_goods
    - customized
    - salesperson
    - customer_region
    disclosures:
    - id: profit.customer_month.basis
      mode: required_always
      text: &id001 按报表归属月汇总客户全部属性组合行；同一客户同月可多行。无产品和订单字段，不能按产品/订单拆分客户月度利润。业务员归属缺失的记录保留未知，按业务员筛选只覆盖明确归属记录，不用现客户负责人补写。
    answer_note: *id001
    time_granularity: month
    time_value_format: month
    include_known_subset: true
