default_disclosures:
- id: profit.scope
  mode: required_always
  text: 利润报表金额和毛利率的分子分母均为人民币元，毛利率本身为比例。没有核算完成标识，统一解释为截至查询时已记录的利润，历史月份也可能随后续费用分配更新。
- id: profit.missing-fees
  mode: required_always
  text: 费用空值表示尚未分配到，不等于已确认没有费用。存在未分配项时，完整费用总额仍未知，单列已分配部分和未分配记录数量；不补零重算或重复扣减报表毛利。
- id: profit.internal-scope
  mode: required_always
  text: 客户及订单利润默认不排除内部客户，显式筛选以结果为准；部门及产品利润不提供内部客户拆分，不能宣称已排除内部客户。
metrics:
  customer_month_sales_revenue:
    label: 客户月度利润报表·销售收入（人民币）
    business_definition: 按报表归属月汇总客户全部属性组合行；同一客户同月可多行。无产品和订单字段，不能按产品/订单拆分客户月度利润。业务员归属缺失的记录保留未知，按业务员筛选只覆盖明确归属记录，不用现客户负责人补写。
      销售收入取源报表已记录字段；不宣称已结账。
    unit: 人民币元
    table: vk_ads.customer_profit_ads
    aggregation: sum
    measure: sale_amount_rmb
    time_field: bill_date
    time_policy: current_month
    required_filters: {}
    allowed_dimensions: &id002
    - customer
    - department
    - organization
    - customer_category
    - bill_type
    - internal_customer
    - ccbs_customer
    - brand_customer
    - ha_customer
    - ht_customer
    - defective
    - ready_goods
    - customized
    - salesperson
    - customer_region
    disclosures:
    - id: profit.customer_month.basis
      mode: required_always
      text: &id001 按报表归属月汇总客户全部属性组合行；同一客户同月可多行。无产品和订单字段，不能按产品/订单拆分客户月度利润。业务员归属缺失的记录保留未知，按业务员筛选只覆盖明确归属记录，不用现客户负责人补写。
    answer_note: *id001
    time_granularity: month
    time_value_format: month
    include_known_subset: true
  customer_month_gross_profit:
