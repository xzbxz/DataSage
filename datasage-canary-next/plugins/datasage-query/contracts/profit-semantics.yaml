    value_contract:
      kind: source_exact
      model_rule: 仅使用用户明确提供或受控结果返回的精确原值；不得猜测或扩展。
  salesperson:
    label: 客户月度利润归属业务员
    columns:
    - sales_id
    - sales_name
    filter_column: sales_name
    value_contract:
      kind: entity_exact
      model_rule: 保留用户明确实体，使用现有实体预检和稳定身份绑定。
