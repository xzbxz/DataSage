version: datasage-profit-semantics/v2
domain: profit
contract_role: plugin_physical_execution
business_name: 利润报表已记录值与费用证据
tables:
- vk_ads.customer_profit_ads
- vk_ads.delivery_bill_profit_ads
- vk_ads.dept_profit_ads
- vk_ads.goods_profit_ads
