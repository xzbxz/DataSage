version: datasage-profit-semantics/v1
domain: profit
contract_role: plugin_physical_execution
business_name: 利润报表已记录值与费用证据
tables:
- vk_ads.customer_profit_ads
- vk_ads.delivery_bill_profit_ads
dimensions:
  customer:
    label: 利润报表客户
    columns:
    - customer_id
    - customer_no
    - customer_name
    filter_column: customer_name
    value_contract:
      kind: entity_exact
      model_rule: 保留用户明确实体，使用现有实体预检和稳定身份绑定。
    identity_filter:
      entity_type: customer
      value_field: canonical_id
      column: customer_id
  department:
    label: 利润报表客户部门
    columns:
    - customer_dept
    filter_column: customer_dept
    value_contract:
      kind: source_exact
      model_rule: 仅使用用户明确提供或受控结果返回的精确原值；不得猜测或扩展。
  organization:
    label: 利润报表组织
    columns:
    - org_name
    filter_column: org_name
    value_contract:
      kind: source_exact
