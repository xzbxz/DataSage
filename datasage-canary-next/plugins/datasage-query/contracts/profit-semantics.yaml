  product_month_gross_margin:
    label: 产品月度利润报表·毛利率
    business_definition: 同一利润报表、期间和范围的已记录毛利合计除以已记录销售收入合计，先汇总再计算比率。
    unit: 比例（有符号；展示为百分比）
    time_field: bill_date
    time_policy: current_month
    required_filters: {}
    allowed_dimensions: *id011
    disclosures:
    - id: profit.product_month.basis
      mode: required_always
      text: *id009
    - id: profit.margin.signed
      mode: required_always
      text: 毛利率=已记录毛利合计/已记录销售收入合计。收入非零时保留正负结果；收入为零或任一组成缺失则未定义。负收入下的正比率不代表正盈利，必须同时看收入和毛利。
    answer_note: *id009
    time_granularity: month
    time_value_format: month
    ratio:
      numerator: product_month_gross_profit
      denominator: product_month_sales_revenue
      denominator_policy: nonzero
    formula: SUM(gross_profit_rmb) / SUM(sale_amount_rmb)
    dimension_overrides:
      department: *id012
