version: datasage-mini-customer-risk-planner/v4
domain: customer_risk
audience: agent_planner
purpose: 组织客户应收风险证据，不做信用、停供、催收或经营决策；不包含表、字段或 Join。

dimension_policy:
  filter_only: never_add_output_dimension
  output_dimension_triggers: [explicit_grouping, explicit_ranking, explicit_comparison, explicit_breakdown, metric_required_grain]
  overall_with_filters: dimensions_empty

defaults:
  currency: rmb
  internal_customer: exclude
  current_snapshot: latest_available
  snapshot_comparison_months: 3
  activity_comparison: latest_3_completed_months_vs_preceding_3_completed_months
  formal_dso_period: latest_12_completed_months
  formal_dso_target_days: null
  attention_limit_per_lane: 5
  attention_unique_customer_cap: 15

catalog_status:
  status: test_time_consistency_assertion_only
  authoritative_source: execution_semantics
  model_visibility: false
  rule: 以下手写目录仅供发布期验证 code 仍存在；合同服务不得投影，模型指标和维度目录必须由 execution semantics 生成。

owned_metrics:
  settlement_history: [average_settlement_days, maximum_settlement_days, settlement_days_distribution]
  formal_turnover: [formal_receivable_turnover_days]
  delivery_receipt: [delivery_receipt_comparison]

reused_receivable_evidence:
  - positive_debt_amount
  - aging_over_90_amount
  - overdue_receivable_amount
  - excess_credit_amount
  - uncredited_positive_debt_amount
  - open_receivable_amount
  - open_receivable_bill_count
  - earliest_open_receivable_date
  - debt_days
  - overdue_days

dimension_catalog: [customer, salesperson, department, organization]

reused_receivable_dimension_mapping:
  customer: customer
  department: customer_department
  occurrence_metrics:
    metrics: [overdue_receivable_amount, open_receivable_amount, open_receivable_bill_count, earliest_open_receivable_date, debt_days, overdue_days]
    salesperson: occurrence_salesperson
    organization: occurrence_organization
  snapshot_metrics:
    metrics: [positive_debt_amount, aging_over_90_amount, excess_credit_amount, uncredited_positive_debt_amount]
    salesperson: snapshot_salesperson
    organization: organization
  rule: Select the receivable-domain dimension code from the exact metric family above; never send customer-risk aliases or credit_salesperson to these reused metrics.

planning_rules:
  - Reused receivable evidence is queried with domain=receivable and the explicit dimension mapping above; customer-risk aliases are not valid receivable dimension codes.
  - 只有命中精确概览条件时才使用固定概览包；诊断或开放问题由 Hermes 从已登记指标中选择能检验假设的最小证据。分析种子不是固定清单，不授权未登记指标，也不覆盖用户明确的指标、维度、筛选、时间或操作。
  - 历史实际结算与当前未结算分开查询、分开命名。
  - 正式周转没有已确认目标天数，不把30天或其他假设写成目标。
  - 出库收款对照直接使用 delivery_receipt_comparison，不由模型跨域相减。
  - 决策型问题返回相关证据和缺口，并明确交由业务判断。
  - 单客户当前风险证据中的欠款、账龄、逾期、授信和未结清指标使用各自合同默认的最新快照/当前未结清范围，不传任意历史 time_range；只有用户明确问历史结算、周转或出库收款变化时才使用相应历史指标的时间范围。

recipe_policy:
  exact_overview_bundle: 仅在用户询问客户风险整体、关注地图或明确单客户综合证据，且没有显式单项、趋势、同业比较或原因诊断时使用。
  analysis_seed: 非约束规划提示；必须通过能力覆盖门，且最多在首批结果暴露实质缺口时追加一次针对性查询。
recipes:
  portfolio_overview:
    kind: exact_overview_bundle
    first_call:
      batch_policy: one_query_tool_call
      request_id_policy: unique_recipe_and_metric
      requests:
        - {request: {domain: receivable, mode: metric, metric: positive_debt_amount, dimensions: []}, bindings: {metric_filter_roles: {}, time_range: omit_use_metric_default}, system_scope: {internal_customer: exclude}}
        - {request: {domain: receivable, mode: metric, metric: aging_over_90_amount, dimensions: []}, bindings: {metric_filter_roles: {}, time_range: omit_use_metric_default}, system_scope: {internal_customer: exclude}}
        - {request: {domain: receivable, mode: metric, metric: overdue_receivable_amount, dimensions: []}, bindings: {metric_filter_roles: {}, time_range: omit_use_metric_default}, system_scope: {internal_customer: exclude}}
        - {request: {domain: receivable, mode: metric, metric: excess_credit_amount, dimensions: []}, bindings: {metric_filter_roles: {}, time_range: omit_use_metric_default}, system_scope: {internal_customer: exclude}}
        - {request: {domain: receivable, mode: metric, metric: uncredited_positive_debt_amount, dimensions: []}, bindings: {metric_filter_roles: {}, time_range: omit_use_metric_default}, system_scope: {internal_customer: exclude}}
    optional_second_call:
      batch_policy: one_query_tool_call_only_if_first_call_leaves_a_material_gap
      request_id_policy: new_unique_ids_never_reuse_first_call_ids
      requests:
        - {request: {domain: customer_risk, mode: metric, metric: delivery_receipt_comparison, dimensions: []}, bindings: {metric_filter_roles: {}, time_range: omit_use_metric_default}}
        - {request: {domain: customer_risk, mode: metric, metric: formal_receivable_turnover_days, dimensions: []}, bindings: {metric_filter_roles: {}, time_range: omit_use_metric_default}}
  attention_map:
    kind: exact_overview_bundle
    first_call:
      batch_policy: one_query_tool_call
      request_id_policy: unique_recipe_lane_and_metric
      requests:
        - {lane: breach, request: {domain: receivable, mode: metric, metric: overdue_receivable_amount, dimensions: [customer], order_by: {field: metric_value, direction: desc}, limit: 5}, bindings: {metric_filter_roles: {}, time_range: omit_use_metric_default}, system_scope: {internal_customer: exclude}}
        - {lane: breach, request: {domain: receivable, mode: metric, metric: excess_credit_amount, dimensions: [customer], order_by: {field: metric_value, direction: desc}, limit: 5}, bindings: {metric_filter_roles: {}, time_range: omit_use_metric_default}, system_scope: {internal_customer: exclude}}
        - {lane: breach, request: {domain: receivable, mode: metric, metric: uncredited_positive_debt_amount, dimensions: [customer], order_by: {field: metric_value, direction: desc}, limit: 5}, bindings: {metric_filter_roles: {}, time_range: omit_use_metric_default}, system_scope: {internal_customer: exclude}}
        - {lane: scale, request: {domain: receivable, mode: metric, metric: positive_debt_amount, dimensions: [customer], order_by: {field: metric_value, direction: desc}, limit: 5}, bindings: {metric_filter_roles: {}, time_range: omit_use_metric_default}, system_scope: {internal_customer: exclude}}
        - {lane: scale, request: {domain: receivable, mode: metric, metric: aging_over_90_amount, dimensions: [customer], order_by: {field: metric_value, direction: desc}, limit: 5}, bindings: {metric_filter_roles: {}, time_range: omit_use_metric_default}, system_scope: {internal_customer: exclude}}
    unique_customer_cap: 15
  customer_evidence_card:
    kind: exact_overview_bundle
    first_call:
      batch_policy: one_query_tool_call_after_one_shared_entity_resolution
      request_id_policy: unique_recipe_and_metric
      requests:
        - {request: {domain: receivable, mode: metric, metric: positive_debt_amount, dimensions: []}, bindings: {metric_filter_roles: {customer: required_exact_user_token}, time_range: omit_use_metric_default}, system_scope: {internal_customer: exclude}}
        - {request: {domain: receivable, mode: metric, metric: aging_over_90_amount, dimensions: []}, bindings: {metric_filter_roles: {customer: required_exact_user_token}, time_range: omit_use_metric_default}, system_scope: {internal_customer: exclude}}
        - {request: {domain: receivable, mode: metric, metric: overdue_receivable_amount, dimensions: []}, bindings: {metric_filter_roles: {customer: required_exact_user_token}, time_range: omit_use_metric_default}, system_scope: {internal_customer: exclude}}
        - {request: {domain: receivable, mode: metric, metric: excess_credit_amount, dimensions: []}, bindings: {metric_filter_roles: {customer: required_exact_user_token}, time_range: omit_use_metric_default}, system_scope: {internal_customer: exclude}}
        - {request: {domain: receivable, mode: metric, metric: uncredited_positive_debt_amount, dimensions: []}, bindings: {metric_filter_roles: {customer: required_exact_user_token}, time_range: omit_use_metric_default}, system_scope: {internal_customer: exclude}}
    optional_second_call:
      batch_policy: one_query_tool_call_only_if_first_call_leaves_a_material_gap
      request_id_policy: new_unique_ids_never_reuse_first_call_ids
      requests:
        - {request: {domain: customer_risk, mode: metric, metric: delivery_receipt_comparison, dimensions: []}, bindings: {metric_filter_roles: {customer: required_exact_user_token}, time_range: omit_use_metric_default}}
        - {request: {domain: customer_risk, mode: metric, metric: formal_receivable_turnover_days, dimensions: []}, bindings: {metric_filter_roles: {customer: required_exact_user_token}, time_range: omit_use_metric_default}}
    follow_up_rule: 仅当首批证据不足以回答用户明确关心的历史变化或周转问题时补充。
    answer_requirement: 结论后必须说明证据覆盖与置信限制；当前财务快照只能支持风险关注判断，不能单独证明违约、经营原因或人员责任。
  trend_change: {kind: analysis_seed, subjects: [debt, long_aging, credit_position, settlement_days, delivery_receipt_gap]}
  peer_comparison: {kind: analysis_seed, default_peer: same_customer_department, fallback: self_history_when_sample_is_weak}
  settlement_and_open_pressure: {kind: analysis_seed, settled: [average_settlement_days, maximum_settlement_days, settlement_days_distribution], open: receivable_open_metrics}
  decision_handoff: {kind: analysis_seed, plan: evidence_only_no_business_decision}

answer_boundary:
  - 使用“风险证据、需关注、建议业务复核”，不输出违约预测或人员责任。
  - 每个关注结论列出支持指标、时间与覆盖限制。
  - 出库收款对照的内部客户范围不对称时必须披露。
  - 即使所有查询成功，单客户回答也要简要说明证据覆盖、未知信息或置信限制，不把当前快照写成违约预测或因果结论。
