version: datasage-mini-inventory-planner/v4
domain: inventory
audience: agent_planner
purpose: 将当前库存、月末核算库存、未动销和周转问题映射为受控指标；不包含表名、字段名或 SQL。

dimension_policy:
  filter_only: never_add_output_dimension
  output_dimension_triggers: [explicit_grouping, explicit_ranking, explicit_comparison, explicit_breakdown, metric_required_grain]
  overall_with_filters: dimensions_empty

defaults:
  currency: rmb
  current_inventory_scope: total
  current_on_hand_scope: on_hand
  historical_inventory: latest_or_explicit_month_end_snapshot
  recent_history: latest_6_available_snapshot_months
  turnover_period: latest_12_complete_accounting_months
  turnover_primary_output: cost_turnover_days
  turnover_guidance_output: ddp_turnover_days
  ranking_limit: 10
  ready_goods_scope: ready_and_trial_ready
  slow_moving_threshold: null
  turnover_formula: governed_by_inventory_turnover_days_metric

catalog_status:
  status: test_time_consistency_assertion_only
  authoritative_source: execution_semantics
  model_visibility: false
  rule: 以下手写目录仅供发布期验证 code 仍存在；合同服务不得投影，模型指标和维度目录必须由 execution semantics 生成。

inventory_scope_catalog:
  total: 当前未配、已配和在途库存；用于用户只说“当前库存/库存”时，回答须说明包含在途。
  on_hand: 当前未配和已配库存，不含在途；用于“在仓/现有实物库存”。
  available: 当前未配库存，并排除缺失仓和次品仓；不默认排除 CCBS 仓。
  allocated: 当前已配库存。
  in_transit: 当前在途库存。

metric_catalog:
  current_snapshot:
    - current_inventory_quantity
    - current_inventory_roll_count
    - current_inventory_amount_rmb
    - current_inventory_amount_original
    - current_warehouse_age_days
  month_end_snapshot:
    - month_end_inventory_quantity
    - month_end_inventory_roll_count
    - month_end_inventory_cost_rmb
    - month_end_inventory_cost_original
    - month_end_inventory_ddp_rmb
    - month_end_inventory_ddp_original
    - oldest_inventory_days
  turnover:
    - turnover_net_delivery_rmb
    - inventory_turnover_days

dimension_catalog:
  warehouse: [warehouse, warehouse_department, warehouse_organization, warehouse_region, warehouse_type, warehouse_category, warehouse_missing, warehouse_defective, warehouse_ccbs]
  accounting: [accounting_organization]
  turnover_organization: [department, organization]
  product_detail: [product, color, batch, product_category, product_region, product_print, product_ht, product_made_to_order, product_supplier]
  scope_and_measure: [unit, currency, ready_goods, ready_type, ccbs_customer]

planning_rules:
  - 用户只说“当前库存/库存”时使用 inventory_scope=total，并说明包含未配、已配和在途；用户说“在仓”时使用 on_hand，不得仍使用 total。
  - 当前数量和月末数量必须带 unit 分组或单一 unit 过滤；M 与 m 统一为 m，m、y、kg、Pcs 不换算。
  - 卷/匹数与库存数量是不同计量，不能互相代替；月末卷/匹数保留正负值且不进入默认概览。
  - 当前人民币金额使用 DDP 估值；月末默认金额使用正式核算成本。原币指标必须带 currency 分组或单一币种过滤。
  - 金额或数量覆盖不完整时，只陈述已知小计、缺失数和覆盖率，不把已知小计写成完整总额。
  - 仓库组织使用 warehouse_organization；月末核算组织使用 accounting_organization，两者不得静默替换。
  - 产品分类、区域、印花、HT、是否需定做和供应商来自当前产品主数据；用于历史问题时说明是当前属性补充。
  - ready_goods=y 默认含备货和试备货；用户问精确类型时使用 ready_type。
  - current_warehouse_age_days 是当前在仓最早入仓距今天数；oldest_inventory_days 是月末未动销/未成交天数，两者不是同一指标。
  - oldest_inventory_days 未指定月份时取最近有有效未动销数据的月末；显式月份无值时回答不可用，不得替换成其他月份。
  - inventory_turnover_days 默认最近 12 个完整核算月，一次返回成本主口径和 DDP 指导口径；不得拆成两个自行对齐的查询。
  - 周转天数不可定义时原样说明状态：全局月快照缺失、净出库不大于零、平均成本不大于零或平均 DDP 不大于零；不得输出负数、零或无穷大充当正常周转天数。
  - 只有命中精确概览条件时才使用固定概览包；诊断或开放问题由 Hermes 从已登记指标中选择能检验假设的最小证据。分析种子不是固定清单，不授权未登记指标，也不覆盖用户明确的指标、维度、筛选、时间或操作；不创建滞销阈值，也不自动做补货、清仓或责任判断。

recipe_policy:
  exact_overview_bundle: 仅在用户询问当前库存、在仓库存或月末库存整体概览，且没有显式单项、趋势、排名、比较、拆解或原因诊断时使用。
  analysis_seed: 非约束规划提示；必须通过能力覆盖门并采用自适应软预算。仅当已返回证据仍存在可能实质改变结论的缺口时追加针对性查询；证据足够、边际信息价值低或受控能力不足时停止，不设固定查询、追问或轮数上限。
recipes:
  current_inventory_overview:
    kind: exact_overview_bundle
    requests:
      - {metric: current_inventory_quantity, dimensions: [unit], inventory_scope: total}
      - {metric: current_inventory_roll_count, inventory_scope: total}
      - {metric: current_inventory_amount_rmb, inventory_scope: total}
  current_on_hand_overview:
    kind: exact_overview_bundle
    requests:
      - {metric: current_inventory_quantity, dimensions: [unit], inventory_scope: on_hand}
      - {metric: current_inventory_roll_count, inventory_scope: on_hand}
      - {metric: current_inventory_amount_rmb, inventory_scope: on_hand}
  current_inventory_ranking:
    kind: analysis_seed
    metric: choose_from_current_inventory_metrics
    dimensions: [product, warehouse, warehouse_department, warehouse_organization, ready_goods, ready_type]
    default_limit: 10
  month_end_inventory_overview:
    kind: exact_overview_bundle
    requests:
      - {metric: month_end_inventory_quantity, dimensions: [unit]}
      - {metric: month_end_inventory_cost_rmb}
  month_end_trend:
    kind: analysis_seed
    metrics: [month_end_inventory_quantity, month_end_inventory_cost_rmb]
    time_bucket: month
  change_observations:
    kind: analysis_seed
    label: partial_observations_only
    dimensions: [product, warehouse, warehouse_department, warehouse_organization, ready_goods]
    comparison: previous_period
    default_limit: 10
  explain_change:
    kind: analysis_seed
    first: change_observations
    causal_status: unavailable_without_independent_evidence
  inventory_age_evidence:
    kind: analysis_seed
    metrics: [current_warehouse_age_days, oldest_inventory_days]
  turnover_days:
    kind: analysis_seed
    metric: inventory_turnover_days
    outputs: [cost_turnover_days, ddp_turnover_days]
  slow_moving_evidence:
    kind: analysis_seed
    steps: [month_end_inventory, oldest_inventory_days, inventory_turnover_days]

answer_boundary:
  - 说明当前或月末快照、库存范围、单位、金额估值口径和用户选择的仓库/产品维度。
  - 周转回答说明经营月份、自然天数、平均库存、净出库和可用性状态；成本口径是主结果，DDP 是指导口径。
  - 区分查询失败、空数据、真实零值、字段覆盖不完整和公式不可定义。
  - 不披露表、字段、SQL 或内部执行路径；不输出自动补货、清仓、滞销认定或责任归属。
