version: datasage-mini-receivable-planner/v4
domain: receivable
audience: agent_planner
purpose: 将应收发生、未结清、欠款快照、账龄与授信问题映射为受控指标；不包含物理数据实现。

dimension_policy:
  filter_only: never_add_output_dimension
  output_dimension_triggers: [explicit_grouping, explicit_ranking, explicit_comparison, explicit_breakdown, metric_required_grain]
  overall_with_filters: dimensions_empty

defaults:
  occurrence_time: current_natural_month
  snapshot_time: latest_available_month
  currency: rmb
  exclude_internal_customers: true
  occurrence_department: customer_department
  organization: organization
  current_debt_scope: signed_net_debt
  who_owes_scope: positive_debt_only

catalog_status:
  status: test_time_consistency_assertion_only
  authoritative_source: execution_semantics
  model_visibility: false
  rule: 以下手写目录仅供发布期验证 code 仍存在；合同服务不得投影，模型指标和维度目录必须由 execution semantics 生成。

metric_catalog:
  occurrence: [receivable_occurrence_amount, receivable_bill_count, receivable_customer_count, receivable_quantity, receivable_piece_count]
  occurrence_original: [receivable_occurrence_amount_original]
  open_receivable: [open_receivable_amount, open_receivable_bill_count, open_receivable_customer_count, earliest_open_receivable_date, debt_days]
  open_receivable_original: [open_receivable_amount_original]
  debt_snapshot: [current_debt_amount, positive_debt_amount, debt_customer_count, debt_balance_trend]
  debt_snapshot_original: [current_debt_amount_original]
  aging_buckets: [aging_total_amount, aging_0_30_amount, aging_31_60_amount, aging_61_90_amount, aging_91_120_amount, aging_121_150_amount, aging_151_180_amount, aging_181_240_amount, aging_241_300_amount, aging_301_360_amount, aging_over_360_amount]
  aging_rollups: [aging_over_30_amount, aging_over_60_amount, aging_over_90_amount, aging_over_120_amount, aging_over_150_amount, aging_over_180_amount, aging_over_240_amount, aging_over_300_amount]
  aging_original: [aging_total_amount_original]
  overdue: [overdue_receivable_amount, overdue_customer_count, overdue_days]
  overdue_original: [overdue_receivable_amount_original]
  credit_position: [excess_credit_amount, uncredited_positive_debt_amount, uncredited_debt_customer_count, credit_days]
  credit_original: [excess_credit_amount_original, credit_amount_original]

dimension_catalog:
  entity: [customer, customer_department, organization]
  salesperson_by_source: [occurrence_salesperson, snapshot_salesperson, credit_salesperson]
  organization_by_source: [occurrence_organization, settlement_organization, receipt_organization, sales_organization]
  customer_flags: [customer_region, ccbs_customer, ha_customer, brand_customer, ht_customer]
  detail: [currency, receivable_type, product, month]
  current_customer_supplement: [current_customer_grade, current_customer_resource, current_customer_business_label, current_customer_owner]

planning_rules:
  - 应收发生、未结清明细、欠款月快照和账龄月快照保持分离，不能互相替代或强行调平。
  - 当前净欠款保留正负零；哪些客户欠款使用 positive_debt_amount。
  - 未结清、逾期、超账期和无授信欠款只使用对应受控指标，不由模型重算。
  - 应收发生、未结清、欠款与账龄暴露默认排除内部客户；发生额和快照的部门均使用客户所属部门，组织使用业务组织。
  - 应收周转天数路由到 customer-risk-query。
  - 产品可用于应收发生明细的分组展示；事实没有产品稳定主键，在产品编码唯一性完成治理前，不接受单产品名称或编码的实体筛选。
  - 只有命中精确概览条件时才使用固定概览包；诊断或开放问题由 Hermes 从已登记指标中选择能检验假设的最小证据。分析种子不是固定清单，不授权未登记指标，也不覆盖用户明确的指标、维度、筛选、时间或操作。

recipe_policy:
  exact_overview_bundle: 仅在用户询问对应主题整体或概览，且没有显式单项、趋势、排名、比较、拆解或原因诊断时使用。
  analysis_seed: 非约束规划提示；必须通过能力覆盖门并采用自适应软预算。仅当已返回证据仍存在可能实质改变结论的缺口时追加针对性查询；证据足够、边际信息价值低或受控能力不足时停止，不设固定查询、追问或轮数上限。
recipes:
  receivable_occurrence_overview: {kind: exact_overview_bundle, metrics: [receivable_occurrence_amount, receivable_bill_count, receivable_customer_count]}
  current_debt_overview: {kind: exact_overview_bundle, metrics: [current_debt_amount, positive_debt_amount, debt_customer_count, open_receivable_amount, open_receivable_customer_count]}
  aging_structure: {kind: exact_overview_bundle, metrics: [aging_0_30_amount, aging_31_60_amount, aging_61_90_amount, aging_91_120_amount, aging_121_150_amount, aging_151_180_amount, aging_181_240_amount, aging_241_300_amount, aging_301_360_amount, aging_over_360_amount]}
  trend_change: {kind: analysis_seed, occurrence: receivable_occurrence_amount, debt_snapshot: debt_balance_trend}
  change_observations: {kind: analysis_seed, label: partial_observations_only, occurrence: receivable_occurrence_amount, debt_snapshot: positive_debt_amount, default_limit: 10}
  customer_receivable_card: {kind: analysis_seed, metrics: [current_debt_amount, positive_debt_amount, open_receivable_amount, debt_days, aging_over_90_amount]}
  source_reconciliation: {kind: analysis_seed, metrics: [current_debt_amount, open_receivable_amount, aging_total_amount]}
  explain_change: {kind: analysis_seed, first: change_observations, causal_status: unavailable_without_independent_evidence}

answer_boundary:
  - 明确来源类型、时间或快照月份、人民币或原币口径。
  - 每个应收域结果明确说明不含内部客户；按部门或组织分析时说明采用客户所属部门和业务组织口径。
  - 差异只按来源和粒度解释，不推断未被数据验证的原因。
  - 不做客户风险、停供、催收或授信决策。
