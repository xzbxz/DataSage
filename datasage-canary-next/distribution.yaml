name: datasage-canary-next
version: 0.15.0-rc6
description: Hermes-native digital expert with adaptive analysis and governed evidence
  contracts.
hermes_requires: ==0.20.5
author: datasage
license: Proprietary
env_requires:
  - name: DEEPSEEK_API_KEY
    description: DeepSeek API key used by the Profile model provider.
  - name: DATA_QUERY_MYSQL_HOST
    description: MySQL host used by the governed read-only query plugin.
  - name: DATA_QUERY_MYSQL_PORT
    description: MySQL port.
    required: false
    default: '3306'
  - name: DATA_QUERY_MYSQL_DATABASE
    description: MySQL database containing the governed views and tables.
  - name: DATA_QUERY_MYSQL_USER
    description: MySQL account used by the read-only DataSage query plugin.
  - name: DATA_QUERY_MYSQL_PASSWORD
    description: Password for the DataSage MySQL account.
  - name: DATA_QUERY_MYSQL_SSL_CA
    description: Optional CA certificate path for verified MySQL TLS.
    required: false
  - name: WECOM_BOT_ID
    description: WeCom AI Bot ID.
  - name: WECOM_SECRET
    description: WeCom AI Bot secret.
distribution_owned:
  - .no-bundled-skills
  - ARCHITECTURE.md
  - build_release_receipt.py
  - REFACTOR_CHARTER.md
  - REFACTOR_DESIGN.md
  - distribution.yaml
  - SOUL.md
  - profile.yaml
  - config.yaml
  - plugins/datasage-query
  - tests
  - skills/business-analytics/datasage/SKILL.md
  - skills/business-analytics/datasage/references/answer-boundary.md
  - skills/business-analytics/datasage/references/entity-guidance.md
  - skills/business-analytics/datasage/references/planning-semantics.yaml
  - skills/business-analytics/datasage/references/query-rules.md
