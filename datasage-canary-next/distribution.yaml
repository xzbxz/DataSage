name: datasage-canary-next
version: 0.15.0-rc13
description: Hermes-native governed operating-data expert for delivery, collections,
  receivables, targets, inventory, and customer-risk analysis with evidence-bounded
  recommendations.
hermes_requires: ==0.20.5
author: datasage
license: Proprietary
env_requires:
  - name: DEEPSEEK_API_KEY
    description: DeepSeek API key used by the Profile model provider.
  - name: DATA_QUERY_MYSQL_HOST
    description: MySQL host used by the governed read-only query plugin.
  - name: DATA_QUERY_MYSQL_PORT
    description: MySQL port.
    required: false
    default: '3306'
  - name: DATA_QUERY_MYSQL_DATABASE
    description: MySQL database containing the governed views and tables.
  - name: DATA_QUERY_MYSQL_USER
    description: MySQL account used by the read-only DataSage query plugin.
  - name: DATA_QUERY_MYSQL_PASSWORD
    description: Password for the DataSage MySQL account.
  - name: DATA_QUERY_MYSQL_SSL_CA
    description: Optional CA certificate path for verified MySQL TLS.
    required: false
  - name: WECOM_BOT_ID
    description: WeCom AI Bot ID.
  - name: WECOM_SECRET
    description: WeCom AI Bot secret.
distribution_owned:
  - distribution.yaml
  - SOUL.md
  - profile.yaml
  - config.yaml
  - plugins/datasage-query/__init__.py
  - plugins/datasage-query/analytical_queries.py
  - plugins/datasage-query/capability_contract.py
  - plugins/datasage-query/contract_store.py
