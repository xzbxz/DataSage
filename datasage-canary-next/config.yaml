_config_version: 41
timezone: Asia/Shanghai
model:
  provider: deepseek
  # This canary uses Flash for the current quality/latency replay. Keep one
  # model fixed for the full session so the result remains attributable.
  default: deepseek-v4-flash
  base_url: https://api.deepseek.com/v1
auxiliary:
  background_review:
    # Keep automatic post-turn review off for this Git-governed canary.
    # Explicit /refine remains available; its Memory and Skill mutations
    # stay staged behind the write_approval gates below.
    enabled: false
agent:
  execution_guidance: false
  reasoning_effort: high
tools:
  # DataSage adds three non-core tools to the standard Hermes host surface.
  # Keep this small deferrable set eager: deferral added a describe/search round
  # trip to most real turns without enough schema savings to justify it.
  tool_search:
    enabled: "off"
platform_toolsets:
  cli:
    - hermes-cli
    - datasage-query
  # WeCom tool surface: native clarification, the three governed DataSage tools
  # and the official `skills` group.  That group contains management entries, so
  # Skill writes are staged behind skills.write_approval and inline shell stays
  # off; the channel exposes no arbitrary code, terminal, file or web tool, and
  # the retired execute_code experiment is not part of the current surface. Every
  # host-authenticated member with a non-empty identity is intentionally
  # admitted in both DM and group chats; this Profile adds no per-user,
  # group, department, entity, row, domain, or metric filter.
  wecom:
    - clarify
    - datasage-query
    - skills
privacy:
  redact_pii: true
security:
  redact_secrets: true
plugins:
  enabled:
    - datasage-query
  entries:
    datasage-query:
      allow_tool_override: false
      settings:
        production_mode: false
        canary_accept_existing_account: true
        # Temporary canary-only exception for the existing account; never
        # enable this together with production_mode or without the flag above.
        canary_allow_privileged_account: true
        # Temporary canary-only source identity exception; it records, but does
        # not rewrite, an observed server port mismatch.
        canary_allow_source_port_mismatch: true
        # The exception above is bound to this exact configured-to-observed
        # source port pair; other, reverse, or malformed pairs remain denied.
        canary_allowed_source_port_pairs: ["3306:3002"]
        require_tls: false
        mysql_allowed_grant_scopes: []
        mysql_connect_timeout_seconds: 8
        mysql_query_timeout_seconds: 30
        call_timeout_seconds: 60
        max_concurrent_queries: 4
        entity_preflight_max_lookups: 10
        max_rows: 100
        max_cell_chars: 2000
        max_dimension_display_chars: 80
memory:
  # Business-analysis evidence is transient unless the user approves a durable fact.
  write_approval: true
skills:
  # Git is authoritative; tracked expert guidance requires operator approval.
  write_approval: true
  # Keep native Skill viewing free of inline shell execution.
  inline_shell: false
  # Hermes 0.21.1 has a denylist rather than a persistent bundled-skill
  # allowlist. Keep only the reviewed local document, spreadsheet, and
  # presentation capabilities active. The architecture test
  # compares this list with the pinned host inventory so an upgrade cannot
  # activate a newly bundled skill without review.
  disabled:
    - airtable
    - apple-notes
    - apple-reminders
    - architecture-diagram
    - arxiv
    - ascii-art
    - ascii-video
    - baoyu-infographic
    - blocked-page-recovery
    - blogwatcher
    - box
    - claude-code
    - claude-design
    - codebase-inspection
    - codex
    - comfyui
    - competitor-news-monitor
    - computer-use
    - design-md
    - document-to-action-items
    - dogfood
    - email-inbox-triage
    - evaluating-llms-harness
    - excalidraw
    - findmy
    - gif-search
    - github
    - github-auth
    - github-code-review
    - github-issue-to-pr
    - github-issues
    - github-pr-workflow
    - github-repo-management
    - google-workspace
    - grounded-citations
    - hermes-agent-skill-authoring
    - himalaya
    - huggingface-hub
    - humanizer
    - imessage
    - inspecting-hermes-desktop-dom
    - llama-cpp
    - llm-wiki
    - manim-video
    - maps
    - meeting-action-items
    - merge-reconciler
    - nano-pdf
    - node-inspect-debugger
    - notion
    - obsidian
    - ocr-and-documents
    - opencode
    - openhue
    - p5js
    - plan
    - popular-web-designs
    - pretext
    - product-price-monitor
    - python-debugpy
    - reddit-reading
    - requesting-code-review
    - research-paper-writing
    - rss-feeds
    - sdlc-review
    - serving-llms-vllm
    - session-librarian
    - simplify-code
    - sketch
