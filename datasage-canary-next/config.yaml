_config_version: 34
timezone: Asia/Shanghai
model:
  provider: deepseek
  # This profile is the complex-analysis lane. Route cheap lookup traffic
  # through a separate Flash profile instead of switching models mid-session.
  default: deepseek-v4-pro
  base_url: https://api.deepseek.com/v1
agent:
  reasoning_effort: high
tools:
  # DataSage exposes only four profile tools. Hermes' own guidance recommends
  # eager schemas for a small toolset; deferral added a describe/search round
  # trip to most real turns without enough schema savings to justify it.
  tool_search:
    enabled: "off"
platform_toolsets:
  cli:
    - hermes-cli
    - datasage-query
  # Preserve the standard Hermes host surface and add governed business tools.
  wecom:
    - hermes-wecom
    - datasage-query
  cron:
    - datasage-query
privacy:
  redact_pii: true
security:
  redact_secrets: true
hooks:
  output_spill:
    max_chars: 16000
plugins:
  enabled:
    - datasage-query
  entries:
    datasage-query:
      allow_tool_override: false
      settings:
        production_mode: false
        canary_accept_existing_account: true
        require_tls: false
        mysql_allowed_grant_scopes: []
        mysql_connect_timeout_seconds: 8
        mysql_health_connect_timeout_seconds: 5
        mysql_grant_audit_timeout_seconds: 10
        mysql_query_timeout_seconds: 30
        call_timeout_seconds: 60
        max_concurrent_queries: 4
        entity_preflight_max_lookups: 10
        max_rows: 100
        max_cell_chars: 2000
        max_dimension_display_chars: 80
        # Keep internal and public budgets below Hermes' final wire ceiling.
        # The final wrapper also returns a partial prefix instead of discarding
        # every successful result when a batch is still too large.
        max_tool_result_chars: 90000
        max_result_bytes: 80000
        max_batch_bytes: 85000
        # Business owner approval recorded 2026-08-11: every authenticated
        # WeCom member may use the complete governed DataSage data surface.
        data_entitlements:
          enforcement: enforce
          default_effect: deny
          principals:
            - platform: wecom
              user_id: "*"
              tools:
                - datasage_catalog
                - datasage_entity_resolve
                - datasage_reference
                - datasage_query
              domains: ["*"]
              metrics:
                delivery: ["*"]
                receipt: ["*"]
                receivable: ["*"]
                target: ["*"]
                customer_risk: ["*"]
                inventory: ["*"]
              entity_types: ["*"]
              allow_catalog_discovery: true
              allow_unscoped_entity_resolution: true
              allow_type_neutral_entity_resolution: true
              allow_entity_resolution_all_rows: true
              reference_sources:
                - expert_playbooks
                - answer_boundary
                - entity_guidance
                - query_rules
                - planner_delivery
                - planner_receipt
                - planner_receivable
                - planner_target
                - planner_customer_risk
                - planner_inventory
              allow_shared_references: true
              allow_reference_index: true
              allow_all_rows: true
skills:
  # Git is authoritative; tracked expert guidance requires operator approval.
  write_approval: true
  # Keep only the small set of skills that materially supports a governed
  # digital expert. Disabled skill files remain installed and recoverable.
  disabled:
    - airtable
    - apple-notes
    - apple-reminders
    - architecture-diagram
    - arxiv
    - ascii-art
    - ascii-video
    - baoyu-infographic
    - blogwatcher
    - claude-code
    - claude-design
    - codebase-inspection
    - codex
    - comfyui
    - common-data-foundation
    - competitor-news-monitor
    - computer-use
    - datasage-query-patterns
    - design-md
    - document-to-action-items
    - dogfood
    - email-inbox-triage
    - evaluating-llms-harness
    - excalidraw
    - findmy
    - gif-search
    - github-auth
    - github-code-review
    - github-issue-to-pr
    - github-issues
    - github-pr-workflow
    - github-repo-management
    - google-workspace
    - hermes-agent
    - hermes-agent-skill-authoring
    - himalaya
    - huggingface-hub
    - imessage
    - inspecting-hermes-desktop-dom
    - llama-cpp
    - llm-wiki
    - manim-video
    - maps
    - meeting-action-items
    - merge-reconciler
    - nano-pdf
    - node-inspect-debugger
    - notion
    - obsidian
    - opencode
    - openhue
    - p5js
    - plan
    - popular-web-designs
    - pretext
    - product-price-monitor
    - python-debugpy
    - requesting-code-review
    - research-paper-writing
    - sdlc-review
    - serving-llms-vllm
    - simplify-code
    - sketch
    - songsee
    - songwriting-and-ai-music
    - spike
    - systematic-debugging
    - teams-meeting-pipeline
    - test-driven-development
    - touchdesigner-mcp
    - weekly-review-planning
    - weights-and-biases
    - xurl
    - youtube-content
platforms:
  wecom:
    enabled: true
    extra:
      bot_id: ${WECOM_BOT_ID}
      secret: ${WECOM_SECRET}
      dm_policy: allowlist
      allow_from: ["*"]
      group_policy: allowlist
      group_allow_from: ["*"]
      groups:
        "*":
          allow_from: ["*"]
      allow_admin_from: []
      user_allowed_commands:
        - new
        - help
        - status
      group_user_allowed_commands:
        - new
        - help
        - status
    home_channel:
      platform: "wecom"
      chat_id: "wo8gxKDAAA0e36LXk9vXJ_nmbnmE2gzg"
      name: "wo8gxKDAAA0e36LXk9vXJ_nmbnmE2gzg"
      user_id: "wo8gxKDAAA0e36LXk9vXJ_nmbnmE2gzg"
approvals:
  destructive_slash_confirm: false
