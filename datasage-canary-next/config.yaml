    - test-driven-development
    - touchdesigner-mcp
    - weekly-review-planning
    - weights-and-biases
    - xurl
    - youtube-content
platforms:
  wecom:
    enabled: true
    extra:
      bot_id: ${WECOM_BOT_ID}
      secret: ${WECOM_SECRET}
      dm_policy: allowlist
      allow_from: ["*"]
      group_policy: allowlist
      group_allow_from: ["*"]
      groups:
        "*":
          allow_from: ["*"]
      # Slash-command gate: the host treats a scope with no admin as ungated,
      # which would let any member approve their own Skill or Memory write.
      # This bot's callbacks report an open-userid (wo...), not the enterprise
      # userid, so the approver has to be listed in that form.
      allow_admin_from: ["wo8gxKDAAA0e36LXk9vXJ_nmbnmE2gzg"]
      group_allow_admin_from: ["wo8gxKDAAA0e36LXk9vXJ_nmbnmE2gzg"]
      user_allowed_commands:
        - new
        - help
        - status
      group_user_allowed_commands:
        - new
        - help
        - status
    home_channel:
      platform: "wecom"
      chat_id: "wo8gxKDAAA0e36LXk9vXJ_nmbnmE2gzg"
      name: "wo8gxKDAAA0e36LXk9vXJ_nmbnmE2gzg"
      user_id: "wo8gxKDAAA0e36LXk9vXJ_nmbnmE2gzg"
approvals:
  destructive_slash_confirm: false

# Keep the Git-managed capability surface stable while debugging.
curator:
  enabled: false

# Use the official Windows npm shim; the old staged Unix wrapper is invalid here.
lsp:
  servers:
    pyright:
      command: ["C:/Users/10192/AppData/Local/hermes/profiles/datasage-canary-next/lsp/node_modules/.bin/pyright-langserver.cmd", "--stdio"]
