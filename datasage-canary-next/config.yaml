_config_version: 35
timezone: Asia/Shanghai
model:
  provider: deepseek
  # This canary uses Flash for the current quality/latency replay. Keep one
  # model fixed for the full session so the result remains attributable.
  default: deepseek-v4-flash
  base_url: https://api.deepseek.com/v1
agent:
  reasoning_effort: high
tools:
  # DataSage adds four non-core tools to the standard Hermes host surface.
  # Keep this small deferrable set eager: deferral added a describe/search round
  # trip to most real turns without enough schema savings to justify it.
  tool_search:
    enabled: "off"
platform_toolsets:
  cli:
    - hermes-cli
    - datasage-query
  # Preserve the standard Hermes host surface and add governed business tools.
  wecom:
    - hermes-wecom
    - datasage-query
  cron:
    - datasage-query
privacy:
  redact_pii: true
security:
  redact_secrets: true
hooks:
  output_spill:
    max_chars: 16000
plugins:
  enabled:
    - datasage-query
  entries:
    datasage-query:
      allow_tool_override: false
      settings:
        production_mode: false
        canary_accept_existing_account: true
        require_tls: false
        mysql_allowed_grant_scopes: []
        mysql_connect_timeout_seconds: 8
        mysql_health_connect_timeout_seconds: 5
        mysql_grant_audit_timeout_seconds: 10
        mysql_query_timeout_seconds: 30
        call_timeout_seconds: 60
        max_concurrent_queries: 4
        entity_preflight_max_lookups: 10
        max_rows: 100
        max_cell_chars: 2000
        max_dimension_display_chars: 80
        # Compact business evidence first, then enforce Hermes' final wire
        # ceiling. Oversized batches retain a complete success-first subset.
        max_tool_result_chars: 90000
        # Business owner approval recorded 2026-08-11: every authenticated
        # WeCom member may use the complete governed DataSage data surface.
        data_entitlements:
          enforcement: enforce
          default_effect: deny
          principals:
            - platform: wecom
              user_id: "*"
              tools:
                - datasage_catalog
                - datasage_entity_resolve
                - datasage_query
              domains: ["*"]
              metrics:
                delivery: ["*"]
                receipt: ["*"]
                receivable: ["*"]
                target: ["*"]
                customer_risk: ["*"]
                inventory: ["*"]
              entity_types: ["*"]
              allow_catalog_discovery: true
              allow_unscoped_entity_resolution: true
              allow_type_neutral_entity_resolution: true
              allow_entity_resolution_all_rows: true
              allow_all_rows: true
skills:
  # Git is authoritative; tracked expert guidance requires operator approval.
  write_approval: true
platforms:
  wecom:
    enabled: true
    extra:
      bot_id: ${WECOM_BOT_ID}
      secret: ${WECOM_SECRET}
      dm_policy: allowlist
      allow_from: ["*"]
      group_policy: allowlist
      group_allow_from: ["*"]
      groups:
        "*":
          allow_from: ["*"]
      allow_admin_from: []
      user_allowed_commands:
        - new
        - help
        - status
      group_user_allowed_commands:
        - new
        - help
        - status
    home_channel:
      platform: "wecom"
      chat_id: "wo8gxKDAAA0e36LXk9vXJ_nmbnmE2gzg"
      name: "wo8gxKDAAA0e36LXk9vXJ_nmbnmE2gzg"
      user_id: "wo8gxKDAAA0e36LXk9vXJ_nmbnmE2gzg"
approvals:
  destructive_slash_confirm: false
